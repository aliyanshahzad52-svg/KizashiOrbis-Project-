  return best.x - T;
}
{

  const glassBack = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, metalness: 0, transparent: true, opacity: 0.05,

  bowl.position.set(bowlX, 0, AX.z); bowl.renderOrder = 6;

  const edge = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.FrontSide,

  attenuationColor: new THREE.Color(0xd5e2dd), attenuationDistance: 2500, clippingPlanes: [clip], side: THREE.DoubleSide, envMapIntensity: 0.9 });
{
  const pts = [new THREE.Vector2(0.01, FLOOR + 6.2)];
  for (const p of outerPts) if (p.y > FLOOR + 6.2) pts.push(new THREE.Vector2(Math.max(p.x - T - 0.4, 0.5), p.y));

  water.position.set(bowlX, 0, AX.z); water.renderOrder = 1;

const SR = 56, SA = 160;                                     // surface grid: rings x segments
const surfGeo = new THREE.BufferGeometry();
{
  const pos = [], idx = [];
  pos.push(0, 0, 0);
  for (let i = 1; i <= SR; i++) for (let j = 0; j < SA; j++) { const a = j / SA * Math.PI * 2; pos.push(Math.cos(a) * i / SR, 0, Math.sin(a) * i / SR); }
  for (let j = 0; j < SA; j++) idx.push(0, 1 + (j + 1) % SA, 1 + j);
  for (let i = 1; i < SR; i++) for (let j = 0; j < SA; j++) {
    const a = 1 + (i - 1) * SA + j, b = 1 + (i - 1) * SA + (j + 1) % SA, c = 1 + i * SA + j, d = 1 + i * SA + (j + 1) % SA;
    idx.push(a, b, c, b, d, c);

  surfGeo.userData.base = new Float32Array(pos);

}
const surfMat = new THREE.MeshPhysicalMaterial({ color: 0xdfe6e3, roughness: 0.03, transparent: true, opacity: 0.5, side: THREE.DoubleSide, envMapIntensity: 1.6, depthWrite: false });
const surf = new THREE.Mesh(surfGeo, surfMat); surf.renderOrder = 4;
surf.position.set(bowlX, W.level, AX.z);
scene.add(surf);
const menMat = new THREE.MeshBasicMaterial({ color: 0x7d8581, transparent: true, opacity: 0.8, depthWrite: false });
const men = new THREE.Mesh(new THREE.TorusGeometry(1, 0.006, 6, 200), menMat);
men.rotation.x = Math.PI / 2; men.renderOrder = 5; scene.add(men);
function updateSurface(t) {
  const r = radiusAt(W.level) - 0.4;
  surf.position.y = W.level; clip.constant = W.level + 0.2;
  men.position.set(bowlX, W.level + 0.6, AX.z); men.scale.set(r + 0.3, r + 0.3, 210);
  const P = surfGeo.attributes.position, B = surfGeo.userData.base;
  for (let i = 0; i < P.count; i++) {
    const x = B[i * 3] * r, z = B[i * 3 + 2] * r;
    let h = 0.5 * Math.sin(x * 0.045 + t * 1.3) * Math.sin(z * 0.05 + t * 1.1);       // faint idle movement
    for (const rp of W.ripples) {

      const d = Math.hypot(x - rp.x, z - rp.z), front = age * 150;
      const env = Math.exp(-age * 1.25) * Math.exp(-Math.pow((d - front) / 34, 2));
      h += rp.a * env * Math.sin((d - front) * 0.2);
      if (age < 0.5) h -= rp.a * 1.6 * Math.exp(-age * 7) * Math.exp(-d * d / 300);   // crater where the pebble enters
    }

    P.setXYZ(i, x, h * Math.max(edge, 0), z);

// ------------------------------------------------------------------ stones and pebbles
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

    v.fromBufferAttribute(p, i);

  ['#a8957c', '50,35,20', 0.42], ['#55575a', '20,20,20', 0.36], ['#8f765c', '40,25,12', 0.36], ['#38332f', '200,190,180', 0.4]];

// ------------------------------------------------------------------ the two crows (picture artwork on cards)

function card(t, box, pivotPx, z) {

  const pv = new THREE.Group(); scene.add(pv);

  pv.position.copy(P0);
  const C = at((x0 + x1) / 2, (y0 + y1) / 2, z);
  m.position.copy(C).sub(P0);
  pv.add(m); m.renderOrder = 5;
  return pv;
}

const SIPS = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(3.6, 12, 8), sipMat.clone()); m.scale.set(1, 1, 1); scene.add(m); return m; });

// ------------------------------------------------------------------ splash droplets + bubbles
// water droplets on a white set read as clear beads with grey rims and a white glint
const dropMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, uniforms: { uFade: { value: 1 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);
    vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uFade; varying vec3 vN; varying vec3 vV; void main(){
    vec3 n = normalize(vN); float ndv = clamp(abs(dot(n, normalize(vV))), 0.0, 1.0);
    float f = pow(1.0 - ndv, 2.2);
    float glint = smoothstep(0.86, 0.97, dot(n, normalize(vec3(-0.45, 0.6, 0.65))));
    vec3 c = mix(vec3(0.93, 0.95, 0.94), vec3(0.30, 0.34, 0.32), f);

const SPL = [];
for (const [i, t0] of DROPS.entries()) for (let k = 0; k < 26; k++) {

}

// ------------------------------------------------------------------ soft contact shadows on the floor
function blob(w, d, op) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');

  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, toneMapped: false }));
  m.rotation.x = -Math.PI / 2; scene.add(m); return m;
}
const bowlShadow = blob(330, 120, 0.42); bowlShadow.position.set(bowlX + 30, FLOOR + 0.3, AX.z + 10);
const chairShadow = blob(380, 110, 0.32); { const p = at(790, 1054, AX.z); chairShadow.position.set(p.x + 10, FLOOR + 0.3, AX.z + 20); }

// ------------------------------------------------------------------ timeline
const ST = { sip: 0, end: 0 };
const tl = gsap.timeline({ paused: true });
const TOTAL = 20;

// opening: slow drift of the camera around the bowl, headline builds like the poster
tl.fromTo(CAM, { az: -5, elev: 7.5, dist: 1.06 }, { az: 3.5, elev: 5.5, dist: 1.0, duration: 13.4, ease: 'sine.inOut' }, 0);
tl.fromTo('#l1', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.2);

tl.fromTo('#scr', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'power2.inOut' }, 0.95);

tl.fromTo('.sv', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.09, ease: 'back.out(1.8)' }, 1.9);
tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, 2.3);
tl.fromTo('.si', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.06, ease: 'back.out(2.2)' }, 2.5);
tl.fromTo('#bar', { scaleY: 0 }, { scaleY: 1, duration: 0.3 }, 2.85);
tl.fromTo('#logo', { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' }, 2.95);
// crow 1: dip, release, straighten, next pebble
DROPS.forEach((t, i) => {
  tl.to(crow1.rotation, { z: deg(-5), duration: 0.35, ease: 'power2.inOut' }, t - 0.35);

const E0 = 13.6;
tl.to(['#head', '#und', '#sub', '#svc', '#rule', '#soc', '#bar'], { opacity: 0, duration: 0.6, ease: 'power2.in' }, E0);

gsap.set(['#dark', '#glow', '#cline', '#contact'], { opacity: 0 });

// icons
const PHONE = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const GLOBE = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h3a15.6 15.6 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.6A15.6 15.6 0 0 0 8.1 8zM12 20a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6a15.6 15.6 0 0 0 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4z"/></svg>';

// ------------------------------------------------------------------ per-frame state
const G = 1500;                                               // px/s^2 (stylised gravity)
const tmp = new THREE.Vector3();
function frame(t) {
  // water level: rises a little after each pebble lands
  let lvl = wy(826);
  for (const p of PEB) lvl += 8.5 * gsap.parseEase('power2.out')(THREE.MathUtils.clamp((t - p.userData.t - 0.45) / 1.2, 0, 1));
  W.level = lvl;
  // pebbles: fall from the beak, splash, sink with drag, settle on the stones
  W.ripples.length = 0;
  for (const [i, p] of PEB.entries()) {
    const u = p.userData, a = t - u.t;
    const start = crow1.localToWorld(tmp.copy(BEAK));
    if (a < 0) { p.visible = false; continue; }
    p.visible = true;
    const hitT = Math.sqrt(2 * Math.max(start.y - W.level, 1) / G);
    if (a < hitT) {
      p.position.set(start.x + (u.rest.x - start.x) * 0.08 * a / hitT, start.y - 0.5 * G * a * a, start.z);
    } else {
      const b = a - hitT, sinkT = 0.95;
      const k = THREE.MathUtils.clamp(b / sinkT, 0, 1), e = 1 - Math.pow(1 - k, 2.2);
      const sx = start.x + (u.rest.x - start.x) * 0.08;
      p.position.set(sx + (u.rest.x - sx) * e, W.level + (u.rest.y - W.level) * e, start.z + (u.rest.z - start.z) * e);
    }
    p.rotation.set(a * 2.2 + u.spin, a * 1.3, a * 0.7);
    const sx = start.x - bowlX, sz = start.z - AX.z;
    W.ripples.push({ t: u.t + hitT, x: sx, z: sz, a: 4.2 });
    u.hit = u.t + hitT; u.hx = start.x; u.hz = start.z;
  }
  updateSurface(t);
  // splash droplets (crown + a few tall jets)
  for (const s of SPL) {
    const u = PEB[s.drop].userData, a = t - (u.hit ?? 99);
    const life = s.crown ? 0.7 : 0.9;
    if (a < 0 || a > life) { s.m.visible = false; continue; }
    s.m.visible = true;
    const sp = s.crown ? s.sp : s.sp * 0.3, up = s.crown ? s.up * 0.75 : s.up * 1.25;
    const y = W.level + up * a - 0.5 * G * 1.1 * a * a;
    if (y < W.level - 1) { s.m.visible = false; continue; }
    s.m.position.set(u.hx + Math.cos(s.a) * sp * a * 0.9, y, u.hz + Math.sin(s.a) * sp * a * 0.6);
    const r = s.r * (1 - 0.4 * a / life); s.m.scale.set(r, r * 1.25, r);
  }
  // crown sheet: a short-lived thin water wall rising and opening up around the entry point
  CROWNS.forEach((m, i) => {
    const u = PEB[i].userData, a = t - (u.hit ?? 99), life = 0.5;
    if (a < 0 || a > life) { m.visible = false; return; }
    m.visible = true; const k = a / life;
    const r = 12 + 38 * Math.sqrt(k), hgt = 52 * Math.sin(Math.PI * Math.min(k * 1.25, 1));
    m.scale.set(r, Math.max(hgt, 0.1), r);
    m.position.set(u.hx, W.level + hgt / 2, u.hz);
    m.material.uniforms.uFade.value = 1 - k * k;
  });
  // bubbles rising behind the sinking pebble
  for (const b of BUB) {
    const u = PEB[b.drop].userData, a = t - (u.hit ?? 99) - b.d * 0.6;
    if (a < 0 || a > 2.2) { b.m.visible = false; continue; }
    const y0 = W.level - 30 - b.d * 80, y = y0 + b.v * a;
    if (y > W.level - 2) { b.m.visible = false; continue; }
    b.m.visible = true;
    b.m.position.set(u.hx + b.dx + Math.sin(a * 7 + b.dx) * 2.5, y, u.hz + b.dz);
    b.m.scale.setScalar(b.r);
  }
  // crow 2 sipping: a gentle bob of the whole character and water slugs running up the straw
  const sp = ST.sip;
  crow2.rotation.z = deg(0.5) * Math.sin(sp * 1.6);
  crow2.position.y += 0;
  SIPS.forEach((m, k) => {
    const ph = ((sp * 0.42 + k / 3) % 1);
    const u = 0.04 + ph * 0.9;
    m.position.copy(strawCurve.getPointAt(u));
    const inWater = m.position.y < W.level;
    m.material.opacity = sp > 0.3 && sp < 13.4 && !inWater ? 0.55 * Math.sin(Math.PI * ph) : 0;
  });
  // fade the 3D scene into the brand black during the ending
  const e = ST.end;
  scene.background.setRGB(0.95 * (1 - e) + 0.008 * e, 0.953 * (1 - e) + 0.047 * e, 0.95 * (1 - e) + 0.024 * e).convertSRGBToLinear();
}
const bgBase = new THREE.Color(0xf2f3f2);
const crow2Home = crow2.position.clone(), crow1Home = crow1.position.clone();
function draw(t) {
  frame(t);
  placeCamera();
  renderer.render(scene, camera);
}
window.renderAt = t => { tl.seek(t, false); draw(t); return true; };
await document.fonts.ready;

window.HITS = () => { window.renderAt(13); return PEB.map(p => p.userData.hit); };
window.ready = true;
</script></body></html>

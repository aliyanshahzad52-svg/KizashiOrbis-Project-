<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OrbisNexa Followers Ad</title>
<style>
  @font-face { font-family: P; font-weight: 400; src: url(assets/poppins-latin-400-normal.woff2); }
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  @font-face { font-family: P; font-weight: 800; src: url(assets/poppins-latin-800-normal.woff2); }

  :root {
    --navy: #0c1b3d;
    --blue: #0066d6;
    --sky: #1f7ae8;
    --slate: #42506e;
  }
  html, body { margin: 0; padding: 0; background: #fff; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: P, sans-serif; color: var(--navy);
    background: linear-gradient(180deg, #ffffff 0%, #f4f8fe 45%, #e6effc 100%);
  }
  .abs { position: absolute; }
  #tint, #noise { position: absolute; inset: 0; pointer-events: none; }
  #noise { width: 1080px; height: 1920px; opacity: .03; }

  .grad-text {
    background: linear-gradient(90deg, #0c1b3d 0%, #0d4aa6 45%, #1f7ae8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* hook */
  #hook1, #hook2 { left: 0; width: 1080px; text-align: center; top: 300px; }
  #hook1 .ln, #hook2 .ln { display: block; line-height: 1.08; }
  #hook1 .ln { font-size: 96px; font-weight: 800; letter-spacing: -1px; }
  #hook2 .big { font-size: 132px; font-weight: 800; letter-spacing: -2px; }
  #hook2 .small { font-size: 60px; font-weight: 600; color: var(--slate); margin-top: 10px; }
  .w { display: inline-block; will-change: transform; }
  #grid { left: 90px; top: 640px; width: 900px; height: 600px; }
  .tile { position: absolute; width: 276px; height: 184px; border-radius: 22px;
          box-shadow: 0 18px 40px rgba(12, 27, 61, .16), 0 2px 6px rgba(12, 27, 61, .08); }
  .tile canvas { width: 276px; height: 184px; border-radius: 22px; display: block; }

  /* logo (single instance for the whole film) */
  #logoWrap { left: 0; top: 0; width: 640px; height: 583px; transform-origin: 50% 50%; }
  #logo, #sheen { position: absolute; inset: 0; width: 100%; height: 100%; }
  #sheen {
    -webkit-mask-image: url(assets/logo.png); -webkit-mask-size: 100% 100%;
    mask-image: url(assets/logo.png); mask-size: 100% 100%;
    background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 62%);
    background-size: 300% 100%; background-position: 150% 0; mix-blend-mode: screen;
  }
  #introSub { left: 0; width: 1080px; top: 1150px; text-align: center; font-size: 50px; font-weight: 600; color: var(--slate); letter-spacing: .3px; }
  #introSub b { font-weight: 700; color: var(--blue); }

  /* country scenes */
  .scene { position: absolute; inset: 0; }
  .scene .glow { position: absolute; left: 90px; top: 1060px; width: 900px; height: 900px; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .scene .lm { position: absolute; left: 140px; top: 1010px; width: 800px; height: 880px; }
  .scene .lm svg { width: 100%; height: 100%; display: block; }
  .scene .shadow { position: absolute; left: 190px; top: 1868px; width: 700px; height: 60px; border-radius: 50%;
                   background: radial-gradient(closest-side, rgba(12,27,61,.22), rgba(12,27,61,0)); }
  .scene .flag { position: absolute; left: 420px; top: 585px; width: 240px; height: 160px; border-radius: 16px;
                 box-shadow: 0 14px 32px rgba(12, 27, 61, .18); }
  .scene .flag canvas { width: 240px; height: 160px; display: block; border-radius: 16px; }
  .scene .label { position: absolute; left: 0; width: 1080px; top: 770px; text-align: center;
                  font-size: 34px; font-weight: 600; letter-spacing: 9px; color: var(--blue); }
  .scene .label .num { color: var(--slate); opacity: .75; letter-spacing: 2px; margin-right: 18px; }
  .scene .name { position: absolute; left: 0; width: 1080px; top: 815px; text-align: center;
                 font-size: 124px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; }
  .scene .tag { position: absolute; left: 0; width: 1080px; top: 962px; text-align: center;
                font-size: 46px; font-weight: 500; color: var(--slate); }

  #plane { left: 0; top: 0; width: 64px; height: 64px; }
  #trail { left: 0; top: 0; width: 1080px; height: 1920px; }

  /* CTA */
  #cta1 { left: 0; width: 1080px; top: 662px; text-align: center; font-size: 140px; font-weight: 800; letter-spacing: -3px; line-height: 1.05; }
  #handle { left: 0; width: 1080px; top: 826px; text-align: center; font-size: 56px; font-weight: 700; letter-spacing: .5px; }
  #cta2 { left: 0; width: 1080px; top: 912px; text-align: center; font-size: 46px; font-weight: 500; color: var(--slate); line-height: 1.4; }
  #row { left: 0; width: 1080px; top: 1052px; height: 120px; display: flex; justify-content: center; align-items: center; gap: 26px; }
  .soc { width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
         box-shadow: 0 14px 30px rgba(12,27,61,.18); }
  .soc svg { width: 58px; height: 58px; fill: #fff; }
  #fb { background: #0866ff; }
  #ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
  #btn { position: relative; width: 370px; height: 112px; border-radius: 56px; margin-left: 10px;
         background: linear-gradient(90deg, #0c1b3d, #0d4aa6 55%, #1f7ae8); color: #fff;
         font-size: 46px; font-weight: 700; display: flex; align-items: center; justify-content: center;
         box-shadow: 0 16px 34px rgba(13, 74, 166, .35); }
  #btn span { position: absolute; }
  #btnB { opacity: 0; font-size: 42px; }
  #burst { left: 0; top: 0; width: 1080px; height: 1920px; }
  #cursor { left: 0; top: 0; width: 96px; height: 96px; }
  #phones { left: 0; width: 1080px; top: 1192px; text-align: center; font-size: 38px; font-weight: 600; color: var(--navy); }
  #phones .dot { color: var(--blue); margin: 0 18px; }
  #phones svg { width: 34px; height: 34px; vertical-align: -5px; margin-right: 12px; fill: var(--blue); }
</style>
</head>
<body>
<div id="stage">
  <div id="tint"></div>

  <!-- HOOK -->
  <div id="hook1" class="abs">
    <span class="ln"><span class="w">Dreaming</span> <span class="w">of</span></span>
    <span class="ln grad-line"><span class="w grad-text">studying</span> <span class="w grad-text">abroad?</span></span>
  </div>
  <div id="hook2" class="abs">
    <span class="ln big"><span class="w">9</span> <span class="w grad-text">Countries.</span></span>
    <span class="ln small"><span class="w">Endless</span> <span class="w">opportunities.</span></span>
  </div>
  <div id="grid" class="abs"></div>

  <!-- COUNTRIES -->
  <div id="scenes"></div>
  <svg id="trail" class="abs" viewBox="0 0 1080 1920"><path id="trailPath" d="" fill="none" stroke="#0d4aa6" stroke-opacity=".35" stroke-width="4" stroke-dasharray="2 16" stroke-linecap="round"/></svg>
  <svg id="plane" class="abs" viewBox="0 0 64 64"><path fill="#0c1b3d" d="M62 30.5c0-1.9-1.6-3.5-3.5-3.5H40.6L25.6 4.6C25.2 4 24.5 3.6 23.8 3.6h-4.3c-1 0-1.7 1-1.4 1.9L24.2 27H11.6l-4.7-6.3c-.4-.5-1-.8-1.6-.8H2.6c-.9 0-1.6.9-1.3 1.8L4.6 32 1.3 42.3c-.3.9.4 1.8 1.3 1.8h2.7c.6 0 1.2-.3 1.6-.8L11.6 37h12.6l-6.1 21.5c-.3.9.4 1.9 1.4 1.9h4.3c.7 0 1.4-.4 1.8-1L40.6 37h17.9c1.9 0 3.5-1.6 3.5-3.5z"/></svg>

  <!-- INTRO / CTA text -->
  <div id="introSub" class="abs">Your Gateway to <b>Global Education</b></div>
  <div id="cta1" class="abs"><span class="w">Follow</span> <span class="w grad-text">Us</span></div>
  <div id="handle" class="abs"><span class="grad-text">@orbisnexa</span></div>
  <div id="cta2" class="abs"><span class="w">for scholarship alerts, visa updates</span><br><span class="w">&amp; study-abroad tips</span></div>
  <div id="row" class="abs">
    <div class="soc" id="fb"></div>
    <div class="soc" id="ig"></div>
    <div id="btn"><span id="btnA">Follow</span><span id="btnB">Following&nbsp;&#10003;</span></div>
  </div>
  <canvas id="burst" class="abs" width="1080" height="1920"></canvas>
  <div id="phones" class="abs"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>+92 370 0035896<span class="dot">&bull;</span>+92 312 4222204</div>

  <!-- the one and only logo -->
  <div id="logoWrap" class="abs"><img id="logo" src="assets/logo.png"><div id="sheen"></div></div>

  <svg id="cursor" class="abs" viewBox="0 0 96 96">
    <path d="M38 14c-3.3 0-6 2.7-6 6v34l-5.6-4.6c-2.6-2.1-6.4-1.8-8.5.8-2 2.4-1.9 5.9.3 8.2L36 77c3.4 3.6 8.1 5.6 13 5.6h10c9.9 0 18-8.1 18-18V46c0-3.3-2.7-6-6-6-1.2 0-2.3.4-3.2.9-.8-2.3-3-3.9-5.6-3.9-1.5 0-2.9.6-4 1.5-1-2.1-3.1-3.5-5.6-3.5-1.4 0-2.7.5-3.6 1.2V20c0-3.3-2.7-6-6-6z"
          fill="#ffffff" stroke="#0c1b3d" stroke-width="4" stroke-linejoin="round"/>
  </svg>

  <canvas id="noise" width="540" height="960"></canvas>
</div>

<script src="assets/gsap.min.js"></script>
<script src="landmarks.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, DURATION = 28;
const COUNTRIES = [
  { code: 'us', name: 'USA',            tag: 'World-renowned universities',      c: ['#3c3b6e', '#b22234'] },
  { code: 'gb', name: 'United Kingdom', tag: "One-year Master's programmes",      c: ['#012169', '#c8102e'] },
  { code: 'au', name: 'Australia',      tag: 'Post-study work opportunities',    c: ['#012169', '#e4002b'] },
  { code: 'ca', name: 'Canada',         tag: 'Quality education, welcoming cities', c: ['#d52b1e', '#d52b1e'] },
  { code: 'it', name: 'Italy',          tag: 'Scholarships & affordable tuition', c: ['#009246', '#ce2b37'] },
  { code: 'fr', name: 'France',         tag: 'Top-ranked business schools',      c: ['#0055a4', '#ef4135'] },
  { code: 'de', name: 'Germany',        tag: 'Low-cost public universities',     c: ['#dd0000', '#ffce00'] },
  { code: 'fi', name: 'Finland',        tag: 'World-class education system',     c: ['#002f6c', '#5b8bd6'] },
  { code: 'se', name: 'Sweden',         tag: 'Innovation-led universities',      c: ['#006aa7', '#fecc02'] },
];
const SCENE0 = 6.0, SCENE_LEN = 2.0, CTA0 = SCENE0 + SCENE_LEN * COUNTRIES.length;   // 24.0

// ------------------------------------------------------------ assets
const flagSrc = {};
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

async function loadFlags() {
  for (const c of COUNTRIES) {
    const img = await loadImg(`assets/flag_${c.code}.svg`);
    const cv = document.createElement('canvas'); cv.width = 720; cv.height = 480;
    const ctx = cv.getContext('2d');
    // cover-crop the 4:3 artwork into 3:2
    const s = Math.max(720 / img.width, 480 / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.drawImage(img, (720 - w) / 2, (480 - h) / 2, w, h);
    flagSrc[c.code] = cv;
  }
}

function drawFlag(cv, code, t, amp, speed = 1) {
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height, src = flagSrc[code];
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.beginPath(); ctx.roundRect(0, 0, w, h, h * 0.1); ctx.clip();
  const step = 2;
  for (let x = 0; x < w; x += step) {
    const u = x / w, k = 0.3 + 0.7 * u;
    const ph = u * Math.PI * 2 * 1.15 - t * Math.PI * 2 * 0.95 * speed;
    const dy = amp * Math.sin(ph) * k;
    ctx.drawImage(src, u * src.width, 0, step / w * src.width + 1, src.height, x, dy - amp, step + 0.6, h + 2 * amp);
    const sh = Math.cos(ph) * 0.13 * k;
    ctx.fillStyle = sh > 0 ? `rgba(255,255,255,${sh})` : `rgba(0,0,0,${-sh * 0.9})`;
    ctx.fillRect(x, 0, step + 0.6, h);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(12,27,61,.10)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(1, 1, w - 2, h - 2, h * 0.1); ctx.stroke();
}

// ------------------------------------------------------------ build DOM
const grid = document.getElementById('grid');
const tiles = [];
COUNTRIES.forEach((c, i) => {
  const d = document.createElement('div'); d.className = 'tile';
  d.style.left = (i % 3) * 312 + 'px'; d.style.top = Math.floor(i / 3) * 208 + 'px';
  const cv = document.createElement('canvas'); cv.width = 552; cv.height = 368;
  d.appendChild(cv); grid.appendChild(d); tiles.push({ el: d, cv, code: c.code });
});

const scenesEl = document.getElementById('scenes');
const scenes = COUNTRIES.map((c, k) => {
  const s = document.createElement('div'); s.className = 'scene';
  s.innerHTML = `
    <div class="glow" style="background: radial-gradient(closest-side, ${c.c[0]}33, ${c.c[1]}22 55%, transparent)"></div>
    <div class="shadow"></div>
    <div class="lm">${LANDMARKS[c.code]}</div>
    <div class="flag"><canvas width="480" height="320"></canvas></div>
    <div class="label"><span class="num">${String(k + 1).padStart(2, '0')} / 09</span>STUDY IN</div>
    <div class="name">${c.name}</div>
    <div class="tag">${c.tag}</div>`;
  scenesEl.appendChild(s);
  return { el: s, cv: s.querySelector('canvas'), c,
           lm: s.querySelector('.lm'), glow: s.querySelector('.glow'), shadow: s.querySelector('.shadow'),
           flag: s.querySelector('.flag'), text: [s.querySelector('.label'), s.querySelector('.name'), s.querySelector('.tag')] };
});

function iconSVG(id) {
  return fetch(`assets/${id}.svg`).then(r => r.text());
}

// noise (dither) frames
const noiseCv = document.getElementById('noise');
const noiseFrames = [];
for (let n = 0; n < 4; n++) {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const ctx = c.getContext('2d'); const im = ctx.createImageData(540, 960);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  ctx.putImageData(im, 0, 0); noiseFrames.push(c);
}

// ------------------------------------------------------------ timeline
const tl = gsap.timeline({ paused: true });
const logo = document.getElementById('logoWrap');
const LOGO_W = 640, LOGO_H = 583;
function logoAt(cx, cy, w) { return { x: cx - LOGO_W / 2, y: cy - LOGO_H / 2, scale: w / LOGO_W }; }

gsap.set(logo, { ...logoAt(540, 800, 640), opacity: 0 });
gsap.set(['#hook2 .w', '#introSub', '#cta1 .w', '#handle', '#cta2 .w', '#row > *', '#phones', '#cursor', '#plane'], { opacity: 0 });
gsap.set('#cursor', { x: 900, y: 1500 });
scenes.forEach(s => { gsap.set([s.lm, s.glow, s.shadow, s.flag, ...s.text], { opacity: 0 }); });

// HOOK (own timeline, pre-rolled so the very first frame is already in motion)
const HOOK_SHIFT = 0.3;
const htl = gsap.timeline({ paused: true });
htl.fromTo('#hook1 .w', { y: 70, opacity: 0, filter: 'blur(10px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: .55, ease: 'power3.out', stagger: .09 }, 0);
tiles.forEach((tile, i) => {
  htl.fromTo(tile.el, { scale: .55, opacity: 0, y: 60 },
            { scale: 1, opacity: 1, y: 0, duration: .5, ease: 'back.out(1.7)' }, 0.2 + i * 0.1);
});
htl.to('#hook1 .w', { y: -50, opacity: 0, filter: 'blur(8px)', duration: .3, ease: 'power2.in', stagger: .04 }, 1.86 + HOOK_SHIFT);
htl.fromTo('#hook2 .w', { y: 70, opacity: 0, filter: 'blur(10px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: .5, ease: 'power3.out', stagger: .08 }, 2.05 + HOOK_SHIFT);
tiles.forEach((tile, i) => {
  const r = Math.floor(i / 3), col = i % 3;
  htl.to(tile.el, { scale: 1.07, duration: .16, ease: 'power2.out', yoyo: true, repeat: 1 }, 2.0 + HOOK_SHIFT + (r + col) * 0.06);
  // fly into the centre where the logo will appear
  const cx = 540 - 90 - (col * 312 + 138), cy = 800 - 640 - (r * 208 + 92);
  htl.to(tile.el, { x: cx, y: cy, scale: .18, opacity: 0, rotation: (col - 1) * 10, duration: .5, ease: 'power3.in' }, 3.42 + HOOK_SHIFT + i * 0.025);
});
htl.to('#hook2 .w', { y: -50, opacity: 0, filter: 'blur(8px)', duration: .35, ease: 'power2.in', stagger: .04 }, 3.4 + HOOK_SHIFT);

// BRAND INTRO ------------------------------------------------
tl.fromTo(logo, { opacity: 0, scale: .52, filter: 'blur(18px)' },
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: .7, ease: 'power3.out' }, 3.92);
tl.fromTo('#sheen', { backgroundPosition: '150% 0' }, { backgroundPosition: '-50% 0', duration: .9, ease: 'power2.inOut' }, 4.55);
tl.fromTo('#introSub', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .55, ease: 'power3.out' }, 4.5);
tl.to('#introSub', { y: -30, opacity: 0, duration: .3, ease: 'power2.in' }, 5.72);
tl.to(logo, { ...logoAt(540, 402, 300), duration: .75, ease: 'power3.inOut' }, 5.75);

// COUNTRIES --------------------------------------------------
scenes.forEach((s, k) => {
  const S = SCENE0 + k * SCENE_LEN + (k === 0 ? 0.25 : 0);
  const out = SCENE0 + k * SCENE_LEN + 1.7;
  tl.fromTo([s.glow, s.shadow], { opacity: 0 }, { opacity: 1, duration: .6, ease: 'power2.out' }, S);
  tl.fromTo(s.lm, { x: 320, opacity: 0, scale: .95, filter: 'blur(10px)' },
            { x: 0, opacity: 1, scale: 1, filter: 'blur(0px)', duration: .8, ease: 'power3.out' }, S);
  tl.fromTo(s.flag, { rotationY: -90, scale: .8, opacity: 0 },
            { rotationY: 0, scale: 1, opacity: 1, duration: .6, ease: 'back.out(1.6)' }, S + 0.02);
  tl.fromTo(s.text, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: .55, ease: 'power3.out', stagger: .07 }, S + 0.1);
  tl.fromTo(s.lm, { scale: 1 }, { scale: 1.035, duration: 1.0, ease: 'none', immediateRender: false }, S + 0.8);
  if (k < scenes.length - 1 || true) {
    tl.to(s.lm, { x: -320, opacity: 0, filter: 'blur(8px)', duration: .42, ease: 'power2.in' }, out);
    tl.to([s.glow, s.shadow], { opacity: 0, duration: .4, ease: 'power2.in' }, out);
    tl.to(s.flag, { rotationY: 90, opacity: 0, duration: .35, ease: 'power2.in' }, out);
    tl.to(s.text, { y: -40, opacity: 0, duration: .32, ease: 'power2.in', stagger: .035 }, out);
  }
});

// CTA --------------------------------------------------------
tl.to(logo, { ...logoAt(540, 448, 380), duration: .8, ease: 'power3.inOut' }, CTA0 - 0.05);
tl.fromTo('#cta1 .w', { y: 70, opacity: 0, filter: 'blur(10px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: .55, ease: 'power3.out', stagger: .1 }, CTA0 + 0.35);
tl.fromTo('#handle', { y: 40, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: .5, ease: 'back.out(1.6)' }, CTA0 + 0.5);
tl.fromTo('#cta2 .w', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'power3.out', stagger: .08 }, CTA0 + 0.65);
tl.fromTo('#row > *', { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(1.8)', stagger: .09 }, CTA0 + 0.75);
tl.fromTo('#phones', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'power3.out' }, CTA0 + 1.05);
// cursor taps "Follow"
tl.fromTo('#cursor', { x: 930, y: 1560, opacity: 0 }, { x: 690, y: 1100, opacity: 1, duration: .7, ease: 'power3.out' }, CTA0 + 1.35);
tl.to('#cursor', { scale: .82, duration: .12, ease: 'power2.in', yoyo: true, repeat: 1, transformOrigin: '40% 20%' }, CTA0 + 2.05);
tl.to('#btn', { scale: .93, duration: .12, ease: 'power2.in', yoyo: true, repeat: 1 }, CTA0 + 2.05);
tl.to('#btnA', { opacity: 0, duration: .15 }, CTA0 + 2.17);
tl.to('#btnB', { opacity: 1, duration: .2 }, CTA0 + 2.2);
tl.to('#btn', { background: 'linear-gradient(90deg, #0c1b3d, #0c1b3d 55%, #0d4aa6)', duration: .3 }, CTA0 + 2.17);
tl.to('#cursor', { x: 980, y: 1500, opacity: 0, duration: .6, ease: 'power2.in' }, CTA0 + 2.6);
tl.fromTo('#sheen', { backgroundPosition: '150% 0' }, { backgroundPosition: '-50% 0', duration: .9, ease: 'power2.inOut', immediateRender: false }, CTA0 + 2.6);
tl.set({}, {}, DURATION);

// ------------------------------------------------------------ per-frame canvas work
const tintEl = document.getElementById('tint');
const trailPath = document.getElementById('trailPath');
const plane = document.getElementById('plane');
const burst = document.getElementById('burst');

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function smooth(x) { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); }

function drawFrame(t) {
  // hook flag tiles
  if (t < 4.2) tiles.forEach((tile, i) => drawFlag(tile.cv, tile.code, t + i * 0.13, 7));
  // scene flags
  scenes.forEach((s, k) => {
    const S = SCENE0 + k * SCENE_LEN;
    if (t > S - 0.3 && t < S + 2.4) drawFlag(s.cv, s.c.code, t, 9);
  });

  // background tint follows the current country colours
  let a = 0, ca = null, cb = null, mix = 0;
  if (t >= SCENE0 - 0.2 && t < CTA0 + 0.4) {
    const f = (t - SCENE0) / SCENE_LEN;
    const k = Math.max(0, Math.min(COUNTRIES.length - 1, Math.floor(f)));
    const p = f - Math.floor(f);
    ca = COUNTRIES[k];
    cb = COUNTRIES[Math.min(COUNTRIES.length - 1, k + 1)];
    mix = k < COUNTRIES.length - 1 ? smooth((p - 0.82) / 0.3) : 0;
    a = smooth((t - SCENE0 + 0.2) / 0.6) * (1 - smooth((t - CTA0 + 0.2) / 0.6));
  }
  if (a > 0.001) {
    const blend = (x, y) => {   // crossfade by stacking both palettes
      return `radial-gradient(900px 900px at 12% 22%, ${hexA(x.c[0], .10 * a * (1 - mix))}, transparent 70%),
              radial-gradient(900px 900px at 12% 22%, ${hexA(y.c[0], .10 * a * mix)}, transparent 70%),
              radial-gradient(1000px 1000px at 92% 88%, ${hexA(x.c[1], .10 * a * (1 - mix))}, transparent 70%),
              radial-gradient(1000px 1000px at 92% 88%, ${hexA(y.c[1], .10 * a * mix)}, transparent 70%)`;
    };
    tintEl.style.background = blend(ca, cb);
  } else tintEl.style.background = 'none';

  // plane glides across on every country change
  let shown = false;
  for (let k = 1; k < COUNTRIES.length; k++) {
    const T = SCENE0 + k * SCENE_LEN;
    const u = (t - (T - 0.42)) / 0.9;
    if (u >= 0 && u <= 1) {
      const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const x0 = -80, x1 = 1160, yb = 1050;
      const px = x0 + (x1 - x0) * e;
      const py = yb - Math.sin(e * Math.PI) * 70;
      const ang = Math.atan2(-Math.cos(e * Math.PI) * 70 * Math.PI, (x1 - x0)) * 180 / Math.PI;
      gsap.set(plane, { x: px - 32, y: py - 32, rotation: ang, opacity: Math.sin(u * Math.PI) * 0.9 });
      // dotted trail behind the plane
      let d = '';
      const tailU = Math.max(0, e - 0.35);
      for (let q = 0; q <= 24; q++) {
        const ee = tailU + (e - tailU) * q / 24;
        const xx = x0 + (x1 - x0) * ee, yy = yb - Math.sin(ee * Math.PI) * 70;
        d += (q ? 'L' : 'M') + xx.toFixed(1) + ' ' + yy.toFixed(1);
      }
      trailPath.setAttribute('d', d);
      trailPath.setAttribute('stroke-opacity', (0.35 * Math.sin(u * Math.PI)).toFixed(3));
      shown = true;
    }
  }
  if (!shown) { gsap.set(plane, { opacity: 0 }); trailPath.setAttribute('d', ''); }

  // follow burst
  const bctx = burst.getContext('2d');
  bctx.clearRect(0, 0, 1080, 1920);
  const tb = t - (CTA0 + 2.18);
  if (tb > 0 && tb < 0.7) {
    const r = document.getElementById('btn').getBoundingClientRect();
    const bx = r.left + r.width / 2, by = r.top + r.height / 2;
    const p = tb / 0.7, e = 1 - Math.pow(1 - p, 3);
    for (let i = 0; i < 12; i++) {
      const ang = i / 12 * Math.PI * 2;
      const r0 = 205 + e * 40, r1 = r0 + 22 * (1 - p);
      bctx.strokeStyle = `rgba(31,122,232,${(1 - p) * 0.9})`; bctx.lineWidth = 6; bctx.lineCap = 'round';
      bctx.beginPath();
      bctx.moveTo(bx + Math.cos(ang) * r0, by + Math.sin(ang) * r0 * 0.36);
      bctx.lineTo(bx + Math.cos(ang) * r1, by + Math.sin(ang) * r1 * 0.36);
      bctx.stroke();
    }
  }

  // film grain / dither
  const nctx = noiseCv.getContext('2d');
  nctx.drawImage(noiseFrames[Math.floor(t * FPS) % 4], 0, 0);
}

window.renderAt = function (t) {
  htl.seek(t + HOOK_SHIFT, false);
  tl.seek(t, false);
  drawFrame(t);
};

window.ready = (async () => {
  await document.fonts.ready;
  await loadFlags();
  await loadImg('assets/logo.png');
  document.getElementById('fb').innerHTML = (await iconSVG('facebook')).replace('<svg', '<svg fill="#fff"');
  document.getElementById('ig').innerHTML = (await iconSVG('instagram')).replace('<svg', '<svg fill="#fff"');
  window.renderAt(0);
  return true;
})();
</script>

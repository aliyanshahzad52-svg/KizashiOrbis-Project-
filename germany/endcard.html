<!doctype html>
<html><head><meta charset="utf-8">
<!-- OrbisNexa end card, step for step after the reference (absolute video times):
     25.4 white  | 25.50 / 25.67 the two check lines rise in | 27.5 they fade out
     28.0 "Contact Now" pill + framed box with the numbers draws in | 28.5 light sweep over the logo | hold -->
<style>
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  :root { --navy: #0c1b3d; --blue: #0b4fb3; --sky: #2f86ee; }
  html, body { margin: 0; background: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: P, sans-serif; background: #fff; }
  .abs { position: absolute; }
  #logoW { left: 340px; top: 545px; width: 400px; height: 364px; overflow: hidden; }
  #logoW img { position: absolute; left: 0; top: 0; width: 400px; }
  #sheen { left: -50%; top: -10%; width: 30%; height: 120%; transform: rotate(18deg);
           background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); filter: blur(4px); mix-blend-mode: screen; }
  #checks { left: 540px; top: 965px; transform: translateX(-50%); width: max-content; }
  .ck { display: flex; align-items: center; gap: 14px; font-size: 48px; font-weight: 600; color: var(--navy); line-height: 1.55; opacity: 0; }
  .ck svg { width: 40px; height: 40px; }
  #box { left: 150px; top: 975px; width: 780px; height: 250px; }
  #frame { position: absolute; left: 0; top: 0; overflow: visible; }
  #pill { left: 390px; top: -32px; transform: translateX(-50%); padding: 6px 54px; border-radius: 16px; font-size: 42px; font-weight: 600;
          color: #fff; background: linear-gradient(180deg, #2f86ee, #0b4fb3); white-space: nowrap; opacity: 0; }
  .num { left: 0; width: 780px; white-space: nowrap; display: flex; justify-content: center; align-items: center; gap: 16px; opacity: 0; }
  .num b { font-size: 58px; white-space: nowrap; font-weight: 700; color: var(--navy); letter-spacing: .5px; line-height: 1; }
  .ic { width: 52px; height: 52px; border-radius: 50%; position: relative; flex: 0 0 52px; background: linear-gradient(145deg, #2a7bff, #0b4fb3); }
  .ic svg { position: absolute; left: 13px; top: 13px; width: 26px; height: 26px; fill: #fff; }
  #n1 { top: 50px; } #n2 { top: 130px; }
  #addr { left: 0; width: 1080px; top: 1262px; display: flex; justify-content: center; align-items: center; gap: 14px; opacity: 0; }
  #addr .t { font-size: 34px; font-weight: 500; color: #2b3a58; }
</style></head>
<body><div id="stage">
  <div id="logoW" class="abs"><img src="assets/logo.png"><div id="sheen" class="abs"></div></div>
  <div id="checks" class="abs">
    <div class="ck"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#2f86ee" stroke-width="2.2"/><path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="#0b4fb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Free Eligibility Check</div>
    <div class="ck"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#2f86ee" stroke-width="2.2"/><path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="#0b4fb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Up to 100% scholarship</div>
  </div>
  <div id="box" class="abs">
    <svg id="frame" width="780" height="250"><path id="fp" d="M 218 2 H 28 Q 2 2 2 28 V 222 Q 2 248 28 248 H 752 Q 778 248 778 222 V 28 Q 778 2 752 2 H 562"
      fill="none" stroke="#2f86ee" stroke-width="4" stroke-linecap="round"/></svg>
    <div id="pill" class="abs">Contact Now</div>
    <div id="n1" class="abs num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 370 0035896</b></div>
    <div id="n2" class="abs num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 312 4222204</b></div>
  </div>
  <div id="addr" class="abs"><span class="ic pin"></span><span class="t">Iqbal, 8 Allama, Raza Block Town, Lahore, Pakistan</span></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PHONE = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const WA = `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;
document.querySelectorAll('.ic.ph').forEach(e => e.innerHTML = PHONE);
document.querySelectorAll('.ic.pin').forEach(e => e.innerHTML = PIN);
document.querySelectorAll('.ic.wa').forEach(e => e.innerHTML = WA);
const tl = gsap.timeline({ paused: true });
tl.set({}, {}, 31);
const L = $('#fp').getTotalLength();
gsap.set('#fp', { strokeDasharray: L, strokeDashoffset: L });
const cks = document.querySelectorAll('.ck');
tl.fromTo(cks, { opacity: 0, y: 24, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, stagger: 0.17, ease: 'power2.out' }, 25.5);
tl.to(cks, { opacity: 0, y: -10, filter: 'blur(6px)', duration: 0.28, stagger: 0.07, ease: 'power2.in' }, 27.5);
tl.fromTo('#pill', { opacity: 0, y: 18, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out' }, 28.0);
tl.to('#fp', { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 28.12);
tl.fromTo('#n1', { opacity: 0, y: 16, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out' }, 28.2);
tl.fromTo('#n2', { opacity: 0, y: 16, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out' }, 28.38);
tl.fromTo('#addr', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 28.6);
tl.fromTo('#sheen', { left: '-50%' }, { left: '130%', duration: 0.75, ease: 'power2.inOut' }, 28.5);
window.renderAt = t => { tl.seek(t, false); return true; };
window.ready = document.fonts.ready.then(() => true);
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<!-- OrbisNexa end card, step-for-step after the reference: mark builds, wordmark types on, frame draws,
     sparkle ticks, contact lines de-blur, social icons pop in. Plain white background like the reference. -->
<style>
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  :root { --navy: #0c1b3d; --blue: #0b4fb3; }
  html, body { margin: 0; background: #fafafa; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: P, sans-serif; background: #fafafa; }
  .abs { position: absolute; }
  #logo { left: 360px; top: 683px; width: 360px; height: 328px; }
  .part { position: absolute; left: 0; width: 360px; overflow: hidden; }
  .part img { position: absolute; left: 0; width: 360px; }
  .strip { position: absolute; top: 0; overflow: hidden; }
  .strip img { position: absolute; top: 0; width: 360px; }
  #frame { left: 304px; top: 627px; overflow: visible; }
  .tick { position: absolute; width: 6px; height: 22px; border-radius: 3px; background: var(--blue); opacity: 0; transform-origin: 50% 100%; }
  #cap { left: 0; width: 1080px; top: 1286px; text-align: center; font-size: 40px; font-weight: 600; color: var(--navy); }
  #info { left: 540px; top: 1352px; transform: translateX(-50%); width: max-content; white-space: nowrap;
          display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; opacity: 0; }
  .row b { font-size: 62px; font-weight: 700; color: var(--navy); line-height: 1; letter-spacing: .3px; margin-left: 6px; }
  .ic { width: 54px; height: 54px; border-radius: 50%; position: relative; flex: 0 0 54px; background: var(--blue); }
  .ic svg { position: absolute; left: 13px; top: 13px; width: 28px; height: 28px; fill: #fff; }
  #addr { margin-top: 12px; gap: 18px; }
  #addr span.t { font-size: 33px; font-weight: 500; color: #2b3a58; line-height: 1.35; }
  #soc { left: 0; width: 1080px; top: 1640px; display: flex; justify-content: center; align-items: center; gap: 46px; }
  .s { width: 64px; height: 64px; position: relative; opacity: 0; }
  .s svg { width: 64px; height: 64px; fill: var(--navy); }
  #handle { font-size: 42px; font-weight: 700; color: var(--navy); opacity: 0; }
  #handle { display: none !important; }            /* handle removed from all videos */
</style></head>
<body><div id="stage">
  <div id="logo" class="abs"></div>
  <svg id="frame" class="abs" width="472" height="440"><path id="fpath" d="M 3 3 H 469 V 437 H 3 Z" fill="none" stroke="#0b4fb3" stroke-width="7" stroke-linejoin="miter"/></svg>
  <div id="ticks" class="abs" style="left:784px;top:600px"></div>
  <div id="cap" class="abs">For further details, Call / WhatsApp</div>
  <div id="info" class="abs">
    <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></span><span class="ic wa"></span><b>+92 370 0035896</b></div>
    <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></span><span class="ic wa"></span><b>+92 312 4222204</b></div>
    <div class="row" id="addr"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span><span class="t">Iqbal, 8 Allama, Raza Block Town,<br>Lahore, Pakistan</span></div>
  </div>
  <div id="soc" class="abs"><span class="s" id="ig"></span><span class="s" id="fb"></span><span id="handle">@orbisnexa</span></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const SVG = { whatsapp: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`, instagram: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg>`, facebook: `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>` };
const H = 328, S = 360 / 1016;
// logo bands (source px): emblem 0-600, wordmark 600-800, CONSULTANCY 800-868, tagline 868-925
const BANDS = [[0, 600], [600, 800], [800, 868], [868, 925]];
function build() {
  document.querySelectorAll('.ic.wa').forEach(e => e.innerHTML = SVG.whatsapp);
  $('#ig').innerHTML = SVG.instagram; $('#fb').innerHTML = SVG.facebook;
  const L = $('#logo');
  // emblem as 3 vertical strips that grow up one after another (like the reference's bars)
  const eh = BANDS[0][1] * S, n = 3, sw = 360 / n;
  for (let k = 0; k < n; k++) {
    const d = document.createElement('div'); d.className = 'strip';
    Object.assign(d.style, { left: k * sw + 'px', width: (sw + 1) + 'px', height: eh + 'px' });
    d.innerHTML = `<img src="assets/logo.png" style="left:${-k * sw}px">`; L.appendChild(d);
  }
  BANDS.slice(1).forEach(([a, b], i) => {
    const d = document.createElement('div'); d.className = 'part'; d.id = 'band' + (i + 1);
    Object.assign(d.style, { top: a * S + 'px', height: (b - a) * S + 'px' });
    d.innerHTML = `<img src="assets/logo.png" style="top:${-a * S}px">`; L.appendChild(d);
  });
  [-38, -8, 22].forEach((r, i) => { const t = document.createElement('div'); t.className = 'tick';
    t.style.left = (i * 20) + 'px'; t.style.transform = `rotate(${r}deg)`; $('#ticks').appendChild(t); });
  const P = $('#fpath'), len = P.getTotalLength();
  gsap.set(P, { strokeDasharray: len, strokeDashoffset: len });
  const tl = window.tl = gsap.timeline({ paused: true });
  const T0 = 13.25;                                    // reference: first bar of the mark appears
  tl.set({}, {}, 19.1);
  tl.fromTo('.strip', { clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)', duration: 0.16, stagger: 0.12, ease: 'power2.out' }, T0);
  tl.fromTo('#band1', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.34, ease: 'steps(9)' }, T0 + 0.45);
  tl.fromTo('#band2', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.2, ease: 'steps(11)' }, T0 + 0.82);
  tl.fromTo('#band3', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.2, ease: 'steps(18)' }, T0 + 0.98);
  tl.to(P, { strokeDashoffset: 0, duration: 0.5, ease: 'power1.inOut' }, 14.85);
  tl.fromTo('.tick', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.1, stagger: 0.03 }, 15.5);
  tl.to('.tick', { opacity: 0, y: -12, duration: 0.18, stagger: 0.03 }, 15.68);
  tl.fromTo('#cap', { opacity: 0, filter: 'blur(10px)', scaleY: 1.4 }, { opacity: 1, filter: 'blur(0px)', scaleY: 1, duration: 0.18 }, 16.3);
  tl.fromTo('.row', { opacity: 0, filter: 'blur(12px)', y: 10 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 0.2, stagger: 0.07 }, 16.34);
  tl.fromTo('#ig', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, 16.75);
  tl.fromTo('#fb', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, 16.95);
  tl.fromTo('#handle', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, 17.15);
}
window.ready = (async () => {
  build();
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  return true;
})();
window.renderAt = t => { window.tl.seek(t, false); return true; };
</script></body></html>

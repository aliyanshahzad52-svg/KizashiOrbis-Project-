<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Italy Promo Graphics v2</title>
<style>
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  @font-face { font-family: P; font-weight: 800; src: url(assets/poppins-latin-800-normal.woff2); }
  :root { --navy: #0c1b3d; --blue: #0066d6; --sky: #1f7ae8; --gold1: #f2b01e; --gold2: #d47a00; --green: #12a150; }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: P, sans-serif; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }

  /* ---------------- background typography (behind the speaker) */
  .bt { position: absolute; left: 0; width: 1080px; top: 0; text-align: center; opacity: 0; transform-origin: 50% 40%; }
  .bt .ln { display: block; white-space: nowrap; line-height: .98; font-weight: 800; letter-spacing: -.014em; color: var(--navy); }
  .bt .ln span { display: inline-block; }
  .bt .s  { font-size: 62px; font-weight: 700; letter-spacing: .26em; color: var(--blue); margin-bottom: 14px; }
  .bt .m  { font-size: 116px; }
  .bt .l  { font-size: 146px; }
  .bt .xl { font-size: 192px; }
  .bt .xxl{ font-size: 250px; letter-spacing: -.024em; }
  .bt .grad { background: linear-gradient(180deg, #0c1b3d 0%, #0d4aa6 60%, #1f7ae8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bt.gold .grad { background: linear-gradient(180deg, #f6be2c 0%, #e39200 55%, #b85f00 100%); -webkit-background-clip: text; background-clip: text; }
  .bt.green .grad { background: linear-gradient(180deg, #1fc46c 0%, #0f9a4c 100%); -webkit-background-clip: text; background-clip: text; }
  .bt .ln.big { filter: drop-shadow(0 10px 24px rgba(12, 27, 61, .18)); }
  .bt .chip { display: inline-block; font-size: 58px; font-weight: 800; color: #fff; background: var(--green); border-radius: 22px; padding: 4px 26px; letter-spacing: 0; margin-top: 12px; }
  .bt .flag { width: 96px; height: 64px; border-radius: 10px; display: inline-block; vertical-align: -14px; margin-right: 22px; box-shadow: 0 8px 20px rgba(12,27,61,.25); }

  /* ---------------- captions */
  #cap { left: 40px; width: 1000px; top: 1150px; text-align: center; }
  .chunk { position: absolute; left: 0; width: 1000px; top: 0; line-height: 1.18; }
  .cw { display: inline-block; position: relative; font-size: 78px; font-weight: 800; letter-spacing: -1px; color: #fff; margin: 0 10px;
        text-shadow: 0 3px 3px rgba(0,0,0,.35), 0 8px 30px rgba(0,0,0,.45); }
  .cw.key, .cw.num { padding: 0 16px; text-shadow: none; }
  .cw .pill { position: absolute; inset: 8px -3px 2px -3px; border-radius: 18px; z-index: -1;
              background: linear-gradient(100deg, #0c1b3d 0%, #0d4aa6 45%, #1f7ae8 100%); box-shadow: 0 10px 28px rgba(8, 24, 60, .4); }
  .cw.num .pill { background: linear-gradient(100deg, #b85f00 0%, #e39200 50%, #f6be2c 100%); box-shadow: 0 10px 28px rgba(120, 60, 0, .35); }

  /* ---------------- right-column graphics (in front) */
  .g { position: absolute; left: 836px; top: 500px; width: 210px; height: 420px; opacity: 0; }
  .tile { position: absolute; left: 10px; top: 60px; width: 190px; height: 190px; border-radius: 40px; background: #fff;
          box-shadow: 0 24px 50px rgba(8,20,52,.30), 0 3px 10px rgba(8,20,52,.12); display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 124px; height: 124px; }
  .lbl { position: absolute; left: -20px; width: 290px; top: 310px; text-align: center; font-size: 34px; font-weight: 800; color: #fff;
         text-shadow: 0 3px 3px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.45); line-height: 1.1; }
  .note { position: absolute; width: 150px; height: 82px; }
  .coinstack { position: absolute; left: 40px; top: 0; width: 170px; height: 420px; }
  .coin { position: absolute; left: 0; width: 170px; height: 62px; }
  .plus { position: absolute; left: -10px; top: 0; width: 270px; text-align: center; font-size: 46px; font-weight: 800; color: #fff;
          background: var(--green); border-radius: 22px; padding: 4px 0; box-shadow: 0 12px 28px rgba(10,100,50,.35); opacity: 0; }
  .spark { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #ffd34d; box-shadow: 0 0 18px #ffd34d; opacity: 0; }

  /* ---------------- name lower-third */
  #name { left: 60px; top: 960px; opacity: 0; }
  #name .bar { position: absolute; left: 0; top: 6px; width: 10px; height: 136px; border-radius: 5px; background: linear-gradient(180deg, #1f7ae8, #0c1b3d); }
  #name .n { margin-left: 30px; font-size: 66px; font-weight: 800; color: #fff; text-shadow: 0 3px 3px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.5); white-space: nowrap; }
  #name .r { margin-left: 32px; font-size: 38px; font-weight: 600; color: #cfe3ff; text-shadow: 0 2px 3px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.45); white-space: nowrap; }

  /* ---------------- end card */
  #end { inset: 0; opacity: 0; background: linear-gradient(180deg, #ffffff 0%, #f2f7fe 55%, #e2ecfb 100%); }
  #endGlow { inset: 0; background: radial-gradient(900px 700px at 50% 36%, rgba(31,122,232,.12), transparent 70%); }
  #endLogoWrap { left: 250px; top: 420px; width: 580px; height: 528px; }
  #endLogo, #endSheen { position: absolute; inset: 0; width: 100%; height: 100%; }
  #endSheen { -webkit-mask-image: url(assets/logo.png); -webkit-mask-size: 100% 100%;
              background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 62%);
              background-size: 300% 100%; background-position: 150% 0; }
  #endLine { left: 390px; top: 1010px; width: 300px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, #1f7ae8, transparent); }
  #endEyebrow { left: 0; width: 1080px; top: 1046px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 10px; color: var(--blue); }
  .ph { left: 0; width: 1080px; text-align: center; font-size: 66px; font-weight: 800; color: var(--navy); letter-spacing: -0.5px; }
  .ph svg { width: 54px; height: 54px; vertical-align: -6px; margin-right: 18px; fill: var(--blue); }
  #ph1 { top: 1108px; } #ph2 { top: 1198px; }
</style>
</head>
<body>
<div id="stage">
  <div id="back" class="layer"></div>
  <div id="front" class="layer">
    <div id="gfx"></div>
    <div id="cap" class="abs"></div>
    <div id="end" class="abs">
      <div id="endGlow" class="abs"></div>
      <div id="endLogoWrap" class="abs"><img id="endLogo" src="assets/logo.png"><div id="endSheen"></div></div>
      <div id="endLine" class="abs"></div>
      <div id="endEyebrow" class="abs">CONTACT US</div>
      <div id="ph1" class="abs ph"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>+92 370 0035896</div>
      <div id="ph2" class="abs ph"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>+92 312 4222204</div>
    </div>
  </div>
</div>

<script src="assets/gsap.min.js"></script>
<script>
let E = null, tl = null;
const flagSrc = {}, flags = [], counters = [];
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const fmt = v => Math.round(v).toLocaleString('en-US');

// ---------------------------------------------------------------- illustrations (flat, brand colours)
const NOTE = `<svg viewBox="0 0 150 82" class="note"><rect x="2" y="2" width="146" height="78" rx="10" fill="#2f9e62"/><rect x="10" y="10" width="130" height="62" rx="6" fill="none" stroke="#bfeccf" stroke-width="3"/><circle cx="75" cy="41" r="22" fill="#bfeccf"/><text x="75" y="52" font-family="P" font-weight="800" font-size="32" text-anchor="middle" fill="#1d7a46">€</text></svg>`;
const COIN = `<svg viewBox="0 0 170 62" class="coin"><ellipse cx="85" cy="38" rx="82" ry="22" fill="#b46a00"/><rect x="3" y="24" width="164" height="14" fill="#b46a00"/><ellipse cx="85" cy="24" rx="82" ry="22" fill="url(#cg)"/><ellipse cx="85" cy="24" rx="64" ry="15" fill="none" stroke="#fff3c4" stroke-opacity=".7" stroke-width="3"/><text x="85" y="33" font-family="P" font-weight="800" font-size="26" text-anchor="middle" fill="#8a4f00">€</text></svg>`;
const DEFS = `<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset=".5" stop-color="#f6b51e"/><stop offset="1" stop-color="#d98a00"/></linearGradient>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f7ae8"/><stop offset="1" stop-color="#0c1b3d"/></linearGradient></defs></svg>`;
const ICON = {
  coinx: `<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="56" fill="url(#cg)"/><circle cx="75" cy="75" r="44" fill="none" stroke="#fff3c4" stroke-width="4" opacity=".8"/><text x="75" y="96" font-family="P" font-weight="800" font-size="60" text-anchor="middle" fill="#8a4f00">€</text><line class="strike" x1="26" y1="124" x2="124" y2="26" stroke="#e5383b" stroke-width="12" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="140"/></svg>`,
  cap: `<svg viewBox="0 0 150 150"><path d="M10 58 75 30l65 28-65 28z" fill="url(#bg1)"/><path d="M38 74v26c0 10 17 20 37 20s37-10 37-20V74L75 90z" fill="#0d4aa6"/><path d="M132 60v38" stroke="#f6b51e" stroke-width="6" stroke-linecap="round"/><circle cx="132" cy="104" r="8" fill="#f6b51e"/></svg>`,
  home: `<svg viewBox="0 0 150 150"><path d="M20 74 75 28l55 46" fill="none" stroke="url(#bg1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 66v56h78V66" fill="#e8f1fd" stroke="#0d4aa6" stroke-width="10" stroke-linejoin="round"/><rect x="63" y="88" width="24" height="34" rx="4" fill="#1f7ae8"/></svg>`,
  food: `<svg viewBox="0 0 150 150"><circle cx="75" cy="80" r="46" fill="#e8f1fd" stroke="#0d4aa6" stroke-width="8"/><circle cx="75" cy="80" r="28" fill="#fff" stroke="#1f7ae8" stroke-width="6"/><path d="M14 30v34M8 30v18c0 8 12 8 12 0V30" stroke="#0c1b3d" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M136 30c-9 6-12 18-12 34h12v60" stroke="#0c1b3d" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`,
  doc: `<svg viewBox="0 0 150 150"><path d="M40 16h50l30 30v84a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V24a8 8 0 0 1 8-8z" fill="#e8f1fd" stroke="#0d4aa6" stroke-width="8" stroke-linejoin="round"/><path d="M90 16v30h30" fill="none" stroke="#0d4aa6" stroke-width="8" stroke-linejoin="round"/><path d="M50 62h40M50 80h50" stroke="#9cbbe6" stroke-width="7" stroke-linecap="round"/><circle cx="104" cy="112" r="28" fill="#12a150"/><path class="tick" d="M91 112l9 9 17-18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40"/></svg>`,
  scan: `<svg viewBox="0 0 150 150"><rect x="20" y="22" width="110" height="106" rx="14" fill="#e8f1fd" stroke="#0d4aa6" stroke-width="7"/><circle cx="62" cy="62" r="16" fill="#1f7ae8"/><path d="M36 106c4-16 14-22 26-22s22 6 26 22" fill="#1f7ae8"/><path d="M96 56h20M96 74h20M96 92h14" stroke="#9cbbe6" stroke-width="6" stroke-linecap="round"/><g class="lens"><circle cx="0" cy="0" r="22" fill="rgba(255,255,255,.35)" stroke="#0c1b3d" stroke-width="7"/><path d="M15 15l18 18" stroke="#0c1b3d" stroke-width="9" stroke-linecap="round"/></g></svg>`,
  check: `<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="60" fill="#12a150"/><circle cx="75" cy="75" r="60" fill="none" stroke="#7fe0aa" stroke-width="6" opacity=".6"/><path class="tick" d="M46 78l20 20 40-42" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90"/></svg>`,
  calendar: `<svg viewBox="0 0 150 150"><rect x="16" y="26" width="118" height="108" rx="16" fill="#fff" stroke="#0d4aa6" stroke-width="7"/><path d="M16 42a16 16 0 0 1 16-16h86a16 16 0 0 1 16 16v20H16z" fill="url(#bg1)"/><text x="75" y="56" font-family="P" font-weight="800" font-size="24" text-anchor="middle" fill="#fff" letter-spacing="3">SEP</text><text class="yr" x="75" y="114" font-family="P" font-weight="800" font-size="40" text-anchor="middle" fill="#0c1b3d">2027</text><path d="M46 14v22M104 14v22" stroke="#0c1b3d" stroke-width="8" stroke-linecap="round"/></svg>`,
  bell: `<svg viewBox="0 0 150 150"><g class="bellg"><path d="M75 22c-24 0-38 18-38 42v22l-12 18h100l-12-18V64c0-24-14-42-38-42z" fill="url(#bg1)"/><circle cx="75" cy="118" r="12" fill="#0c1b3d"/></g><circle cx="112" cy="36" r="20" fill="#12a150"/><text x="112" y="44" font-family="P" font-weight="800" font-size="22" text-anchor="middle" fill="#fff">1</text></svg>`,
  clock: `<svg viewBox="0 0 150 150"><circle cx="75" cy="84" r="52" fill="#e8f1fd" stroke="#0d4aa6" stroke-width="8"/><path d="M62 18h26M75 18v14M118 40l9-9" stroke="#0c1b3d" stroke-width="8" stroke-linecap="round"/><path class="hand" d="M75 84V48" stroke="#e5383b" stroke-width="7" stroke-linecap="round"/><circle cx="75" cy="84" r="7" fill="#0c1b3d"/></svg>`,
};
const LABEL = { zero: 'No tuition fee', cap: 'Fully funded', doc: 'Documents', scan: 'Profile check', check: 'Eligible', calendar: 'Intake', live: 'Now open', clock: 'Limited seats' };

function drawFlag(cv, code, t) {
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height, src = flagSrc[code], amp = 7;
  ctx.clearRect(0, 0, w, h); ctx.save(); ctx.beginPath(); ctx.roundRect(0, 0, w, h, 30); ctx.clip();
  for (let x = 0; x < w; x += 2) {
    const u = x / w, k = 0.3 + 0.7 * u, ph = u * Math.PI * 2.2 - t * Math.PI * 1.9, dy = amp * Math.sin(ph) * k;
    ctx.drawImage(src, u * src.width, 0, 2 / w * src.width + 1, src.height, x, dy - amp, 2.6, h + 2 * amp);
    const sh = Math.cos(ph) * 0.12 * k; ctx.fillStyle = sh > 0 ? `rgba(255,255,255,${sh})` : `rgba(0,0,0,${-sh})`; ctx.fillRect(x, 0, 2.6, h);
  }
  ctx.restore();
}

function fitLine(el, maxW) {
  const inner = el.firstElementChild || el;
  const w = inner.getBoundingClientRect().width;
  if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w) + 'px';
}

function build() {
  document.body.insertAdjacentHTML('beforeend', DEFS);
  tl = gsap.timeline({ paused: true });
  const back = document.getElementById('back');

  // ------------------------------------------------ background typography
  E.back.forEach(b => {
    const d = document.createElement('div');
    d.className = 'bt' + (b.accent ? ' ' + b.accent : '');
    let html = '';
    b.lines.forEach(([txt, size, at], k) => {
      const big = size !== 's';
      let content = txt === '€COUNT' ? '<span class="cnt">€0</span>' : txt;
      if (b.flag && k === 0) content = `<canvas class="flag" width="300" height="200"></canvas>` + content;
      html += `<span class="ln ${size}${big ? ' big' : ''}"><span class="${big ? 'grad' : ''}">${content}</span></span>`;
    });
    if (b.count) html += `<span class="ln s sub" style="margin-top:18px"><span>ANNUAL STIPEND</span></span>`;
    d.innerHTML = html; back.appendChild(d);
    const lines = [...d.querySelectorAll('.ln')];
    lines.forEach(l => fitLine(l, 960));
    // vertical placement: high on the wall, so the head only overlaps the lower edge of the type
    d.style.top = '205px';
    if (b.flag) flags.push({ cv: d.querySelector('canvas'), code: b.flag[0], t0: b.t0, t1: b.t1 });

    tl.set(d, { opacity: 1 }, b.t0);
    tl.fromTo(d, { scale: 1 }, { scale: 1.045, duration: b.t1 - b.t0, ease: 'none' }, b.t0);
    lines.forEach((l, k) => {
      const at = b.lines[k] ? (b.lines[k][2] !== undefined ? b.lines[k][2] : b.t0 + k * 0.12) : b.t0 + .9;
      const ls = l.classList.contains('s') ? '.26em' : (l.classList.contains('xxl') ? '-.024em' : '-.014em');
      tl.fromTo(l, { opacity: 0, y: 70, filter: 'blur(14px)', letterSpacing: l.classList.contains('s') ? '.34em' : '.06em' },
                   { opacity: 1, y: 0, filter: 'blur(0px)', letterSpacing: ls,
                     duration: .5, ease: 'power3.out' }, Math.max(b.t0, at - .06));
    });
    if (b.flag) tl.fromTo(d.querySelector('.flag'), { opacity: 0, scale: .7, rotationY: -70 }, { opacity: 1, scale: 1, rotationY: 0, duration: .55, ease: 'back.out(1.6)' }, b.flag[1] - .08);
    if (b.count) {
      const cnt = d.querySelector('.cnt'), o = { v: 0 };
      counters.push({ el: cnt, o });
      b.count.forEach(([t, from, to, dur]) => tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: 'power2.out', immediateRender: false }, t));
      const sub = d.querySelector('.sub');
      tl.fromTo(sub, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .4 }, b.count[0][0] + .9);
    }
    tl.to(d, { opacity: 0, y: -40, filter: 'blur(10px)', duration: .28, ease: 'power2.in' }, b.t1 - .28);
  });

  // ------------------------------------------------ captions
  const cap = document.getElementById('cap');
  E.captions.forEach(c => {
    const d = document.createElement('div'); d.className = 'chunk';
    d.innerHTML = c.words.map(w => {
      const num = /\d/.test(w.text);
      const cls = num ? ' num' : (w.key ? ' key' : '');
      return `<span class="cw${cls}">${(w.key || num) ? '<span class="pill"></span>' : ''}${w.text}</span>`;
    }).join(' ');
    cap.appendChild(d); c.el = d; c.ws = [...d.querySelectorAll('.cw')];
    gsap.set(d, { opacity: 0 });
    tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: .05 }, c.t0 - .06);
    tl.set(d, { opacity: 0 }, c.t1);
    c.words.forEach((w, k) => {
      const el = c.ws[k], t = Math.max(w.t0 - .05, c.t0 - .06);
      tl.fromTo(el, { opacity: 0, y: 26, filter: 'blur(8px)', scale: .92 }, { opacity: 1, y: 0, filter: 'blur(0px)', scale: 1, duration: .2, ease: 'power3.out' }, t);
      const pill = el.querySelector('.pill');
      if (pill) tl.fromTo(pill, { scaleX: .2, opacity: 0 }, { scaleX: 1, opacity: 1, duration: .24, ease: 'power3.out' }, t + .02);
    });
  });

  // ------------------------------------------------ name lower-third
  const nm = null;
  // ------------------------------------------------ right-column graphics
  const gfx = document.getElementById('gfx');
  E.front.forEach(f => {
    if (f.kind === 'name') return;
    const g = document.createElement('div'); g.className = 'g'; gfx.appendChild(g);
    tl.set(g, { opacity: 1 }, f.t0 - .02);
    tl.to(g, { opacity: 0, y: -30, scale: .9, duration: .28, ease: 'power2.in' }, f.t1 - .28);

    if (f.kind === 'cashout') {                      // banknotes flying away
      for (let k = 0; k < 6; k++) {
        const n = document.createElement('div'); n.style.cssText = 'position:absolute;left:50px;top:300px;width:150px;height:82px'; n.innerHTML = NOTE; g.appendChild(n);
        const t = f.t0 + .05 + k * .32;
        tl.fromTo(n, { opacity: 0, x: 0, y: 40, rotation: -10, scale: .6 },
                     { opacity: 1, x: (k % 2 ? 60 : -60), y: -300 - 30 * (k % 3), rotation: 30 * (k % 2 ? 1 : -1), scale: 1, duration: 1.3, ease: 'power2.out' }, t);
        tl.to(n, { opacity: 0, duration: .3 }, t + 1.0);
      }
      g.insertAdjacentHTML('beforeend', `<div class="lbl" style="top:340px">Costs <span style="color:#ff6b6b">▲</span></div>`);
      tl.fromTo(g.querySelector('.lbl'), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .35, ease: 'power3.out' }, f.t0 + .2);
      return;
    }
    if (f.kind === 'coins') {                        // stack grows with the amount
      const st = document.createElement('div'); st.className = 'coinstack'; g.appendChild(st);
      const plus = document.createElement('div'); plus.className = 'plus'; plus.textContent = '+ €3,000'; g.appendChild(plus);
      const total = 10, base = 360;
      for (let k = 0; k < total; k++) {
        const c = document.createElement('div'); c.style.cssText = `position:absolute;left:0;top:${base - k * 24}px;width:170px;height:62px`; c.innerHTML = COIN; st.appendChild(c);
        const step = k < 7 ? f.steps[0] : f.steps[1];
        const idx = k < 7 ? k : k - 7, n = k < 7 ? 7 : 3;
        const t = step[0] + 0.04 + idx * (step[2] * 0.85 / n);
        tl.fromTo(c, { opacity: 0, y: -220 }, { opacity: 1, y: 0, duration: .22, ease: 'bounce.out' }, t);
      }
      tl.fromTo(plus, { opacity: 0, y: 30, scale: .5 }, { opacity: 1, y: -10, scale: 1, duration: .45, ease: 'back.out(2)' }, f.steps[1][0] + .1);
      for (const [t] of f.steps) for (let k = 0; k < 8; k++) {           // sparkle burst at each total
        const s = document.createElement('div'); s.className = 'spark'; s.style.left = '115px'; s.style.top = '140px'; g.appendChild(s);
        const a = k / 8 * Math.PI * 2, tt = t + (t === f.steps[0][0] ? 1.12 : 0.98);
        tl.fromTo(s, { opacity: 1, x: 0, y: 0, scale: 1 }, { opacity: 0, x: Math.cos(a) * 130, y: Math.sin(a) * 110, scale: .3, duration: .6, ease: 'power2.out' }, tt);
      }
      return;
    }
    if (f.kind === 'icons') {
      f.items.forEach(([ic, t], k) => {
        const tile = document.createElement('div'); tile.className = 'tile';
        tile.style.cssText = `top:${k * 215 - 20}px;width:180px;height:180px;left:15px;border-radius:38px`;
        tile.innerHTML = ICON[ic]; g.appendChild(tile);
        tl.fromTo(tile, { opacity: 0, scale: .3, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: .5, ease: 'back.out(2.2)' }, t);
      });
      return;
    }
    // single icon tile + label
    const ic = { zero: 'coinx', live: 'bell' }[f.kind] || f.kind;
    g.insertAdjacentHTML('beforeend', `<div class="tile">${ICON[ic]}</div>`);
    const tile = g.querySelector('.tile');
    tl.fromTo(tile, { opacity: 0, scale: .3, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: .5, ease: 'back.out(2.2)' }, f.t0);
    const q = s => g.querySelector(s);
    if (f.kind === 'zero') tl.to(q('.strike'), { strokeDashoffset: 0, duration: .3, ease: 'power2.out' }, f.t0 + .2);
    if (f.kind === 'doc') tl.to(q('.tick'), { strokeDashoffset: 0, duration: .3, ease: 'power2.out' }, f.check);
    if (f.kind === 'check') tl.to(q('.tick'), { strokeDashoffset: 0, duration: .35, ease: 'power2.out' }, f.t0 + .15);
    if (f.kind === 'scan') tl.fromTo(q('.lens'), { x: 40, y: 50 }, { keyframes: [{ x: 110, y: 60, duration: .7 }, { x: 60, y: 100, duration: .7 }, { x: 105, y: 105, duration: .7 }], ease: 'sine.inOut' }, f.t0 + .2);
    if (f.kind === 'calendar') tl.fromTo(tile, { rotationX: 0 }, { rotationX: 360, duration: .6, ease: 'power2.inOut' }, f.t0 + .05);
    if (f.kind === 'live') tl.fromTo(q('.bellg'), { rotation: 0, transformOrigin: '75px 22px' }, { keyframes: [{ rotation: 16 }, { rotation: -14 }, { rotation: 10 }, { rotation: -6 }, { rotation: 0 }], duration: .9, ease: 'sine.inOut' }, f.t0 + .1);
    if (f.kind === 'clock') tl.fromTo(q('.hand'), { rotation: 0, transformOrigin: '75px 84px' }, { rotation: 720, duration: f.t1 - f.t0, ease: 'none' }, f.t0);
    if (f.kind === 'cap') for (let k = 0; k < 8; k++) {
      const s = document.createElement('div'); s.className = 'spark'; s.style.left = '116px'; s.style.top = '166px'; g.appendChild(s);
      const a = k / 8 * Math.PI * 2;
      tl.fromTo(s, { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: Math.cos(a) * 150, y: Math.sin(a) * 150, duration: .6, ease: 'power2.out' }, f.t0 + .1);
    }
  });

  // ------------------------------------------------ end card
  const V = E.video_len;
  tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: .6, ease: 'power2.inOut' }, V - .05);
  tl.fromTo('#endLogoWrap', { opacity: 0, scale: .84, y: 34, filter: 'blur(16px)' }, { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: .9, ease: 'power3.out' }, V + .2);
  tl.fromTo('#endSheen', { backgroundPosition: '150% 0' }, { backgroundPosition: '-50% 0', duration: 1.0, ease: 'power2.inOut' }, V + .9);
  tl.fromTo('#endLine', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: .6, ease: 'power3.out' }, V + .9);
  tl.fromTo('#endEyebrow', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, V + 1.0);
  tl.fromTo(['#ph1', '#ph2'], { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out', stagger: .12 }, V + 1.15);
  tl.set({}, {}, E.duration);
}

window.renderAt = function (t) {
  tl.seek(t, false);
  counters.forEach(c => c.el.textContent = '€' + fmt(c.o.v));
  flags.forEach(f => { if (t > f.t0 - .2 && t < f.t1 + .2) drawFlag(f.cv, f.code, t); });
};
window.showLayer = function (which) {
  document.getElementById('back').style.visibility = which === 'back' ? 'visible' : 'hidden';
  document.getElementById('front').style.visibility = which === 'front' ? 'visible' : 'hidden';
};

window.ready = (async () => {
  await document.fonts.ready;
  E = await (await fetch('edit.json')).json();
  for (const code of ['eu', 'it']) {
    const img = await loadImg(`assets/flag_${code}.svg`);
    const cv = document.createElement('canvas'); cv.width = 600; cv.height = 400;
    const s = Math.max(600 / img.width, 400 / img.height);
    cv.getContext('2d').drawImage(img, (600 - img.width * s) / 2, (400 - img.height * s) / 2, img.width * s, img.height * s);
    flagSrc[code] = cv;
  }
  await loadImg('assets/logo.png');
  build();
  window.renderAt(0);
  return true;
})();
</script>
</body>

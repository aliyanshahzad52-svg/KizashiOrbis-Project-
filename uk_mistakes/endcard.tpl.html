<!doctype html><html><head><meta charset="utf-8">
<!-- OrbisNexa end card for the UK-mistakes reel (local time 0..5 s): white chevron background like the
     reference, the logo rotates from its top-left spot into the centre and grows, CTA band, numbers, address. -->
<style>
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  :root { --navy: #0c1b3d; --blue: #1a5fe0; }
  html, body { margin: 0; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: P, sans-serif; background: #fff; }
  .abs { position: absolute; }
  #chev { left: 0; top: 0; }
  #logo { left: 310px; top: -520px; width: 460px; transform-origin: 50% 50%; }
  #head { left: 0; width: 1080px; top: 880px; text-align: center; font-size: 64px; font-weight: 700; color: var(--navy); line-height: 1.12; }
  #head span { color: var(--blue); }
  #band { left: 0; top: 1040px; width: 1080px; height: 118px; background: var(--blue); transform-origin: 0 50%;
          display: grid; place-items: center; color: #fff; font-size: 40px; font-weight: 600; }
  #band span { display: inline-block; }
  #nums { left: 540px; top: 1214px; transform: translateX(-50%); width: max-content; display: flex; flex-direction: column; gap: 22px; }
  .num { display: flex; align-items: center; gap: 16px; opacity: 0; }
  .num b { font-size: 62px; font-weight: 700; color: var(--navy); line-height: 1; margin-left: 6px; letter-spacing: .5px; }
  .ic { width: 62px; height: 62px; border-radius: 50%; position: relative; flex: 0 0 62px; background: linear-gradient(145deg, #2a7bff, #0b4fb3); }
  .ic svg { position: absolute; left: 16px; top: 16px; width: 30px; height: 30px; fill: #fff; }
  #addr { left: 0; width: 1080px; top: 1430px; display: flex; justify-content: center; align-items: center; gap: 16px; opacity: 0; }
  #addr .t { font-size: 34px; font-weight: 500; color: #2b3a58; }
  .rule { left: 0; width: 1080px; height: 8px; background: var(--blue); transform-origin: 0 50%; }
</style></head><body><div id="stage">
  <svg id="chev" class="abs" width="1080" height="1920"></svg>
  <div id="head" class="abs">Ready for <span>UK</span><br>Intake 2026?</div>
  <div id="r1" class="abs rule" style="top:1180px"></div>
  <div id="band" class="abs"><span>Call / WhatsApp us today and let&#8217;s get started!</span></div>
  <div id="nums" class="abs">
    <div class="num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 370 0035896</b></div>
    <div class="num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 312 4222204</b></div>
  </div>
  <div id="addr" class="abs"><span class="ic pin"></span><span class="t">Iqbal, 8 Allama, Raza Block Town, Lahore, Pakistan</span></div>
  <div id="r2" class="abs rule" style="top:1520px"></div>
  <img id="logo" class="abs" src="assets/logo.png">
</div>
<script src="assets/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const PHONE = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
$$('.ic.ph').forEach(e => e.innerHTML = PHONE); $$('.ic.pin').forEach(e => e.innerHTML = PIN);
$$('.ic.wa').forEach(e => e.innerHTML = `{{WA}}`);
let p = '';
for (let y = -120; y < 2000; y += 150) p += `<path d="M-40 ${y + 90} L540 ${y} L1120 ${y + 90}" fill="none" stroke="#1a5fe0" stroke-opacity=".07" stroke-width="46"/>`;
$('#chev').innerHTML = p;
const tl = gsap.timeline({ paused: true });
tl.set({}, {}, 5);
tl.fromTo('#chev', { opacity: 0 }, { opacity: 1, duration: .4 }, 0);
tl.fromTo('#logo', { top: -520, rotation: -360 }, { top: 250, rotation: 0, duration: 1.4, ease: 'power3.out' }, 0.05);
tl.fromTo('#head', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, 1.0);
tl.fromTo('#band', { scaleX: 0 }, { scaleX: 1, duration: .5, ease: 'power3.out' }, 1.3);
tl.fromTo('#band span', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .35 }, 1.6);
tl.fromTo('.rule', { scaleX: 0 }, { scaleX: 1, duration: .5, stagger: .1, ease: 'power3.out' }, 1.3);
tl.fromTo('.num', { opacity: 0, y: 26, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .4, stagger: .15, ease: 'power3.out' }, 1.75);
tl.fromTo('.num .ic', { scale: .3 }, { scale: 1, duration: .45, stagger: .07, ease: 'back.out(2.2)' }, 1.75);
tl.fromTo('#addr', { opacity: 0, y: 20, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .4, ease: 'power3.out' }, 2.15);
tl.fromTo('#addr .ic', { scale: .3 }, { scale: 1, duration: .45, ease: 'back.out(2.2)' }, 2.15);
window.renderAt = t => { tl.seek(t, false); return true; };
window.ready = document.fonts.ready.then(() => true);
</script></body></html>

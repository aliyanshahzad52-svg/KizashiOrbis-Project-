<!doctype html>
<html><head><meta charset="utf-8">
<!-- OrbisNexa "Study destinations" reel - card-stack style of the reference:
     white stage, one rounded photo card per destination rises from below and settles; the previous cards
     step back and up into a stack of tabs; the title types in letter by letter; a light sheen sweeps the card.
     End: the last card collapses, the logo travels from the top-left corner to the centre (rotating, growing),
     then contacts (call / WhatsApp) and the office address appear underneath. Timings measured on the reference. -->
<style>
  @font-face { font-family: P; font-weight: 400; src: url(assets/poppins-latin-400-normal.woff2); }
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  @font-face { font-family: P; font-weight: 800; src: url(assets/poppins-latin-800-normal.woff2); }
  :root { --navy: #0c1b3d; --blue: #0b4fb3; }
  html, body { margin: 0; background: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: P, sans-serif;
           background: radial-gradient(1300px 1500px at 50% 45%, #ffffff 0%, #fbfcfe 70%, #f2f6fc 100%); }
  .abs { position: absolute; }
  .card { position: absolute; left: 228px; top: 408px; width: 623px; height: 1103px; border-radius: 52px; overflow: hidden;
          transform-origin: 50% 0%; box-shadow: 0 30px 60px rgba(12,27,61,.18), 0 6px 16px rgba(12,27,61,.10); visibility: hidden; }
  .card img { position: absolute; left: -4%; top: -4%; width: 108%; height: 108%; object-fit: cover; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 52%;
                 background: linear-gradient(180deg, rgba(5,15,40,0) 0%, rgba(5,15,40,.18) 45%, rgba(5,15,40,.55) 100%); }
  .card .tint { position: absolute; inset: 0; background: rgba(8,30,80,0); }
  .card .sheen { position: absolute; top: -20%; left: -60%; width: 34%; height: 140%; transform: rotate(24deg);
                 background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); filter: blur(6px); }
  .ttl { position: absolute; left: 0; width: 623px; top: 760px; text-align: center; color: #fff; white-space: nowrap;
         text-shadow: 0 4px 18px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.35); }
  .ttl .a { display: block; font-size: 40px; font-weight: 600; letter-spacing: .42em; padding-left: .42em; }
  .ttl .b { display: block; font-size: 128px; font-weight: 800; letter-spacing: 2px; line-height: 1.05; }
  .ttl .bar { display: block; margin: 16px auto 0; width: 120px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #6cc0ff, #2a83f0); transform: scaleX(0); }
  .ch { display: inline-block; white-space: pre; }
  #logo { left: 40px; top: 40px; width: 220px; transform-origin: 50% 50%; }
  /* end */
  #rule { left: 340px; top: 1215px; width: 400px; height: 5px; border-radius: 3px; transform: scaleX(0);
          background: linear-gradient(90deg, rgba(31,122,232,0), #1f7ae8, rgba(31,122,232,0)); }
  #cap { left: 0; width: 1080px; top: 1252px; text-align: center; font-size: 34px; font-weight: 600; color: var(--blue); letter-spacing: 8px; text-indent: 8px; opacity: 0; }
  #nums { left: 540px; top: 1322px; transform: translateX(-50%); width: max-content; display: flex; flex-direction: column; gap: 24px; }
  .num { display: flex; align-items: center; gap: 16px; opacity: 0; }
  .num b { font-size: 68px; font-weight: 700; color: var(--navy); line-height: 1; margin-left: 8px; letter-spacing: .4px; }
  .ic { width: 66px; height: 66px; border-radius: 50%; position: relative; flex: 0 0 66px;
        background: linear-gradient(145deg, #2a7bff 0%, #0b4fb3 60%, #0a3c8c 100%); box-shadow: 0 8px 18px rgba(11,79,179,.25); }
  .ic svg { position: absolute; left: 16px; top: 16px; width: 34px; height: 34px; fill: #fff; }
  #addr { left: 0; width: 1080px; top: 1560px; display: flex; justify-content: center; align-items: center; gap: 18px; opacity: 0; }
  #addr .t { font-size: 38px; font-weight: 500; color: #2b3a58; line-height: 1.35; }
</style></head>
<body><div id="stage">
  <div id="cards"></div>
  <div id="rule" class="abs"></div>
  <div id="cap" class="abs">CALL / WHATSAPP</div>
  <div id="nums" class="abs">
    <div class="num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 370 0035896</b></div>
    <div class="num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 312 4222204</b></div>
  </div>
  <div id="addr" class="abs"><span class="ic pin"></span><span class="t">Iqbal, 8 Allama, Raza Block Town,<br>Lahore, Pakistan</span></div>
  <img id="logo" class="abs" src="assets/logo.png">
</div>
<script src="assets/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PHONE = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const DEST = [['USA', 'usa'], ['AUSTRALIA', 'australia'], ['UK', 'uk'], ['ITALY', 'italy'], ['FINLAND', 'finland']];
// reference rhythm: a new card every ~1.85 s, entry move ~0.7 s
const T = [0.30, 2.15, 4.00, 5.85, 7.70];
const COLLAPSE = 9.65, DUR = 14.5;
// stack slots: front, tab 1, tab 2 (scale about the card's top centre, top position in px)
const SLOT = [{ scale: 1, top: 408 }, { scale: 0.786, top: 248 }, { scale: 0.65, top: 112 }, { scale: 0.55, top: 40 }];
let tl;

function split(el) {
  const t = el.textContent; el.textContent = '';
  for (const c of t) { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; el.appendChild(s); }
}

async function build() {
  document.querySelectorAll('.ic.ph').forEach(e => e.innerHTML = PHONE);
  document.querySelectorAll('.ic.pin').forEach(e => e.innerHTML = PIN);
  const wa = `<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;
  document.querySelectorAll('.ic.wa').forEach(e => e.innerHTML = wa.replace(/<title>.*?<\/title>/, ''));
  const cards = DEST.map(([name, img], k) => {
    const c = document.createElement('div'); c.className = 'card'; c.style.zIndex = 10 + k;
    c.innerHTML = `<img src="bg/${img}.jpg"><div class="shade"></div><div class="tint"></div><div class="sheen"></div>
      <div class="ttl"><span class="a">STUDY IN</span><span class="b">${name}</span><span class="bar"></span></div>`;
    $('#cards').appendChild(c);
    split(c.querySelector('.a')); split(c.querySelector('.b'));
    return c;
  });
  await document.fonts.ready;
  document.querySelectorAll('.ttl .b').forEach(b => {          // long names fit the card
    const w = b.scrollWidth, lim = 550;
    if (w > lim) b.style.fontSize = (128 * lim / w) + 'px';
  });
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));

  tl = gsap.timeline({ paused: true });
  tl.set({}, {}, DUR);
  cards.forEach((c, k) => {
    const t = T[k];
    tl.set(c, { visibility: 'visible' }, t);
    // entry: rises from below, slightly small and motion-blurred, settles into the front slot
    tl.fromTo(c, { top: 1500, scale: 0.9, filter: 'blur(12px)' },
              { top: SLOT[0].top, scale: 1, filter: 'blur(0px)', duration: 0.75, ease: 'power3.out' }, t);
    tl.fromTo(c.querySelector('img'), { scale: 1.12 }, { scale: 1.0, duration: 2.6, ease: 'power1.out' }, t);
    // older cards step back into the tab stack
    for (let j = 0; j < k; j++) {
      const depth = k - j;
      const s = SLOT[Math.min(depth, 3)];
      tl.to(cards[j], { top: s.top, scale: s.scale, filter: `blur(${depth * 1.2}px)`, opacity: depth >= 3 ? 0 : 1,
                        duration: 0.7, ease: 'power3.out' }, t + 0.02);
      tl.to(cards[j].querySelector('.tint'), { backgroundColor: `rgba(8,30,80,${0.12 * depth})`, duration: 0.7 }, t);
      tl.to(cards[j].querySelector('.ttl'), { opacity: 0, duration: 0.25 }, t);
    }
    // title types in, accent bar, light sheen sweep
    const a = c.querySelectorAll('.a .ch'), b = c.querySelectorAll('.b .ch');
    tl.fromTo(a, { opacity: 0, y: 14, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.22, stagger: 0.03, ease: 'power2.out' }, t + 0.45);
    tl.fromTo(b, { opacity: 0, y: 30, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.28, stagger: 0.05, ease: 'power3.out' }, t + 0.62);
    tl.to(c.querySelector('.bar'), { scaleX: 1, duration: 0.4, ease: 'power3.out' }, t + 0.75 + b.length * 0.05);
    tl.fromTo(c.querySelector('.sheen'), { left: '-60%' }, { left: '140%', duration: 0.7, ease: 'power2.inOut' }, t + 1.0);
  });
  // ---- collapse of the last card (reference: bottom rounds up into a pill, shrinks and fades), tabs fade away
  const last = cards[cards.length - 1];
  tl.to(cards.slice(0, -1), { opacity: 0, top: '-=40', duration: 0.35, ease: 'power2.in' }, COLLAPSE - 0.1);
  tl.to(last.querySelector('.ttl'), { opacity: 0, duration: 0.2 }, COLLAPSE);
  tl.to(last, { borderRadius: '52px 52px 320px 320px', duration: 0.25, ease: 'power2.in' }, COLLAPSE);
  tl.to(last, { scale: 0.35, top: 760, opacity: 0, filter: 'blur(6px)', duration: 0.45, ease: 'power3.in' }, COLLAPSE + 0.2);
  // ---- logo: top-left corner -> centre, rotating and growing
  const L0 = COLLAPSE + 0.35;
  tl.to('#logo', { left: 540 - 300, top: 470, width: 600, rotation: 360, duration: 1.4, ease: 'power3.inOut' }, L0);
  tl.to('#rule', { scaleX: 1, duration: 0.5, ease: 'power3.out' }, L0 + 1.35);
  tl.fromTo('#cap', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, L0 + 1.45);
  tl.fromTo('.num', { opacity: 0, y: 34, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.42, stagger: 0.16, ease: 'power3.out' }, L0 + 1.6);
  tl.fromTo('.num .ic', { scale: 0.3 }, { scale: 1, duration: 0.45, stagger: 0.08, ease: 'back.out(2.2)' }, L0 + 1.6);
  tl.fromTo('#addr', { opacity: 0, y: 28, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.42, ease: 'power3.out' }, L0 + 2.05);
  tl.fromTo('#addr .ic', { scale: 0.3 }, { scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, L0 + 2.05);
  tl.fromTo('#logo', { y: 0 }, { y: -8, duration: 2.5, ease: 'sine.inOut' }, L0 + 1.5);
  return true;
}
window.ready = build();
window.renderAt = t => { tl.seek(t, false); return true; };
</script></body></html>

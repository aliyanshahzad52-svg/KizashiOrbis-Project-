<!doctype html>
<html><head><meta charset="utf-8">
<!-- OrbisNexa office promo - graphics layers.
     #back  : large promotional background text (composited BEHIND the people with the person matte),
              animated like the reference: stacked word clusters (small light word + big bold word),
              each word blurs/fades in with a slight rise, the block drifts slowly, blurs out at the cut.
     #front : OrbisNexa logo top-left (travels to the centre at the end), cut flashes, end card. -->
<style>
  @font-face { font-family: P; font-weight: 400; src: url(assets/poppins-latin-400-normal.woff2); }
  @font-face { font-family: P; font-weight: 500; src: url(assets/poppins-latin-500-normal.woff2); }
  @font-face { font-family: P; font-weight: 600; src: url(assets/poppins-latin-600-normal.woff2); }
  @font-face { font-family: P; font-weight: 700; src: url(assets/poppins-latin-700-normal.woff2); }
  @font-face { font-family: P; font-weight: 800; src: url(assets/poppins-latin-800-normal.woff2); }
  @font-face { font-family: A; font-weight: 400; src: url(assets/anton-latin-400-normal.woff2); }
  @font-face { font-family: M; font-weight: 800; src: url(assets/montserrat-latin-800-normal.woff2); }
  @font-face { font-family: M; font-weight: 900; src: url(assets/montserrat-latin-900-normal.woff2); }
  :root { --navy: #0c1b3d; --blue: #0b4fb3; --sky: #2f86ee; }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: P, sans-serif; }
  .abs { position: absolute; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  /* background text blocks */
  .blk { position: absolute; white-space: nowrap; opacity: 0; }
  .ln { display: block; }
  .c { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
  /* big display words (Anton, condensed heavy) */
  .B, .G { font-family: A, sans-serif; font-size: 560px; line-height: .86; letter-spacing: 4px; text-transform: uppercase; }
  .B { color: var(--navy); }
  .G .c { background: linear-gradient(180deg, #6cc0ff 0%, #2a83f0 34%, #0b4fb3 66%, #0a2f74 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .015em; }
  /* tracked secondary line (Montserrat black, brand royal blue) */
  .M { font-family: M, sans-serif; font-weight: 900; font-size: 78px; letter-spacing: .26em; color: var(--blue);
       line-height: 1.25; margin: 10px 0; padding-left: .26em; }
  /* front */
  #logo { left: 44px; top: 30px; width: 230px; filter: drop-shadow(0 0 10px rgba(255,255,255,.55)) drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
  #flash { background: #fff; opacity: 0; }
  #veil { background: radial-gradient(1400px 900px at 50% 42%, rgba(255,255,255,.93), rgba(240,246,255,.9)); opacity: 0; }
  #end { opacity: 1; }
  #rule { left: 760px; top: 600px; width: 400px; height: 5px; border-radius: 3px; transform: scaleX(0);
          background: linear-gradient(90deg, rgba(31,122,232,0), #1f7ae8, rgba(31,122,232,0)); }
  #cap { left: 0; width: 1920px; top: 628px; text-align: center; font-size: 30px; font-weight: 600; color: var(--blue);
         letter-spacing: 9px; text-indent: 9px; opacity: 0; }
  #nums { left: 0; width: 1920px; top: 690px; display: flex; justify-content: center; gap: 90px; }
  .num { display: flex; align-items: center; gap: 14px; opacity: 0; }
  .num b { font-size: 64px; font-weight: 700; color: var(--navy); line-height: 1; margin-left: 8px; letter-spacing: .3px; }
  .ic { width: 60px; height: 60px; border-radius: 50%; position: relative; flex: 0 0 60px;
        background: linear-gradient(145deg, #2a7bff 0%, #0b4fb3 60%, #0a3c8c 100%); box-shadow: 0 8px 18px rgba(11,79,179,.25); }
  .ic svg { position: absolute; left: 15px; top: 15px; width: 30px; height: 30px; fill: #fff; }
  #addr { left: 0; width: 1920px; top: 812px; display: flex; justify-content: center; align-items: center; gap: 18px; opacity: 0; }
  #addr .t { font-size: 38px; font-weight: 500; color: #2b3a58; }
</style></head>
<body><div id="stage">
  <div id="back" class="layer"></div>
  <div id="front" class="layer">
    <div id="flash" class="layer"></div>
    <div id="veil" class="layer"></div>
    <div id="end" class="layer">
      <div id="rule" class="abs"></div>
      <div id="cap" class="abs">CALL / WHATSAPP</div>
      <div id="nums" class="abs">
        <div class="num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 370 0035896</b></div>
        <div class="num"><span class="ic ph"></span><span class="ic wa"></span><b>+92 312 4222204</b></div>
      </div>
      <div id="addr" class="abs"><span class="ic pin"></span><span class="t">Iqbal, 8 Allama, Raza Block Town, Lahore, Pakistan</span></div>
    </div>
    <img id="logo" class="abs" src="assets/logo.png">
  </div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PHONE = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
let tl;

async function build(E) {
  document.querySelectorAll('.ic.ph').forEach(e => e.innerHTML = PHONE);
  document.querySelectorAll('.ic.pin').forEach(e => e.innerHTML = PIN);
  const wa = await (await fetch('assets/whatsapp.svg')).text();
  document.querySelectorAll('.ic.wa').forEach(e => e.innerHTML = wa.replace(/<title>.*?<\/title>/, ''));
  await document.fonts.ready;
  tl = gsap.timeline({ paused: true });
  tl.set({}, {}, E.duration);
  const back = $('#back');
  E.shots.forEach((s, k) => {
    const T = s.text;
    const blk = document.createElement('div'); blk.className = 'blk';
    const R = T.x1 !== undefined;
    blk.style.left = (R ? T.x1 : T.x0) + 'px'; blk.style.top = T.cy + 'px';
    blk.style.transform = R ? 'translate(-100%, -50%)' : 'translate(0, -50%)';
    blk.style.textAlign = R ? 'right' : 'left';
    blk.style.transformOrigin = R ? '100% 50%' : '0% 50%';
    for (const [txt, st] of T.lines) {
      const ln = document.createElement('div'); ln.className = 'ln ' + st;
      if (st === 'M') { const sp = document.createElement('span'); sp.className = 'c'; sp.textContent = txt; ln.appendChild(sp); }
      else for (const ch of txt) { const sp = document.createElement('span'); sp.className = 'c'; sp.textContent = ch; ln.appendChild(sp); }
      blk.appendChild(ln);
    }
    back.appendChild(blk);
    // fit: secondary lines stay fully in the free wall area; big words may tuck n px behind the person
    blk.querySelectorAll('.ln').forEach(ln => {
      const big = !ln.classList.contains('M');
      const lim = T.mw + (big ? T.n : 0);
      const w = ln.scrollWidth;
      if (w > lim) ln.style.fontSize = (parseFloat(getComputedStyle(ln).fontSize) * lim / w) + 'px';
      if (big) ln.style[R ? 'marginRight' : 'marginLeft'] = (-T.n) + 'px';
    });
    const a = s.t0 + (k === 0 ? 0.35 : 0.12), b = s.t1 - 0.2;
    tl.set(blk, { opacity: 1 }, a);
    let at = a;
    blk.querySelectorAll('.ln').forEach(ln => {
      const cs = ln.querySelectorAll('.c');
      if (ln.classList.contains('M')) {
        tl.fromTo(cs, { opacity: 0, letterSpacing: '.6em', filter: 'blur(10px)' },
                  { opacity: 1, letterSpacing: '.26em', filter: 'blur(0px)', duration: 0.55, ease: 'power3.out' }, at);
        at += 0.12;
      } else {
        tl.fromTo(cs, { opacity: 0, yPercent: 38, scale: 1.18, filter: 'blur(18px)' },
                  { opacity: 1, yPercent: 0, scale: 1, filter: 'blur(0px)', duration: 0.5, stagger: 0.045, ease: 'power3.out' }, at);
        at += 0.1 + cs.length * 0.03;
      }
    });
    tl.fromTo(blk, { scale: 1 }, { scale: 1.05, duration: b - a, ease: 'none' }, a);
    tl.to(blk.querySelectorAll('.c'), { opacity: 0, filter: 'blur(18px)', yPercent: -12, duration: 0.24, stagger: 0.008, ease: 'power2.in' }, b - 0.08);
    // cut accents
    if (s.tr === 'flash' && k > 0) {
      tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.85, duration: 0.1, ease: 'power2.in' }, s.t0 - 0.1);
      tl.to('#flash', { opacity: 0, duration: 0.26, ease: 'power2.out' }, s.t0);
    }
  });
  // ---- end: logo travels from the corner to the centre and grows; contacts underneath
  const V = E.video;
  tl.to('#veil', { opacity: 1, duration: 0.9, ease: 'power2.inOut' }, V);
  tl.to('#logo', { left: 960 - 270, top: 70, width: 540, duration: 1.25, ease: 'power3.inOut' }, V + 0.05);
  tl.to('#logo', { filter: 'drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0 6px 16px rgba(12,27,61,.12))', duration: 0.8 }, V + 0.3);
  tl.to('#rule', { scaleX: 1, duration: 0.5, ease: 'power3.out' }, V + 1.3);
  tl.fromTo('#cap', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, V + 1.4);
  tl.fromTo('.num', { opacity: 0, y: 30, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, stagger: 0.16, ease: 'power3.out' }, V + 1.6);
  tl.fromTo('.num .ic', { scale: 0.3 }, { scale: 1, duration: 0.45, stagger: 0.08, ease: 'back.out(2.2)' }, V + 1.6);
  tl.fromTo('#addr', { opacity: 0, y: 24, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, V + 2.05);
  tl.fromTo('#addr .ic', { scale: 0.3 }, { scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, V + 2.05);
  return true;
}
window.init = async E => build(E);
window.renderAt = t => { tl.seek(t, false); return true; };
window.showLayer = w => { $('#back').style.visibility = w === 'back' ? 'visible' : 'hidden'; $('#front').style.visibility = w === 'front' ? 'visible' : 'hidden'; return true; };
</script></body></html>

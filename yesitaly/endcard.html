<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: ID; font-weight: 400; src: url(assets/InterDisplay-Regular.otf); }
  @font-face { font-family: ID; font-weight: 500; src: url(assets/InterDisplay-Medium.otf); }
  @font-face { font-family: ID; font-weight: 600; src: url(assets/InterDisplay-SemiBold.otf); }
  @font-face { font-family: ID; font-weight: 700; src: url(assets/InterDisplay-Bold.otf); }
  :root { --navy: #0c1b3d; --blue: #0b4fb3; --sky: #1f7ae8; }
  html, body { margin: 0; padding: 0; background: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: ID, sans-serif;
           background: radial-gradient(1100px 760px at 50% 30%, #ffffff 0%, #f4f8fe 55%, #e6effb 100%); }
  .abs { position: absolute; }
  #glow { left: -200px; top: 1500px; width: 1480px; height: 900px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(31,122,232,.13), rgba(31,122,232,0)); }
  #logo { left: 50%; top: 330px; width: 640px; transform: translateX(-50%); }
  #logo img { width: 100%; display: block; }
  #eyebrow { left: 0; width: 1080px; top: 1088px; text-align: center; font-size: 34px; font-weight: 600;
             letter-spacing: .34em; color: var(--blue); text-indent: .34em; }
  .ph { left: 0; width: 1080px; text-align: center; font-size: 76px; font-weight: 700; color: var(--navy);
        letter-spacing: -0.02em; white-space: nowrap; }
  .ph .ic { display: inline-block; width: 74px; height: 74px; border-radius: 50%; background: var(--blue);
            vertical-align: -12px; margin-right: 26px; position: relative; }
  .ph .ic svg { position: absolute; left: 19px; top: 19px; width: 36px; height: 36px; fill: #fff; }
  #ph1 { top: 1162px; } #ph2 { top: 1278px; }
  #rule { left: 390px; width: 300px; top: 1428px; height: 3px; border-radius: 2px;
          background: linear-gradient(90deg, rgba(11,79,179,0), var(--blue), rgba(11,79,179,0)); transform-origin: 50% 50%; }
  #addr { left: 0; width: 1080px; top: 1476px; text-align: center; font-size: 42px; font-weight: 500; color: #2b3a58;
          line-height: 1.34; letter-spacing: -0.01em; }
  #addr .pin { display: block; margin: 0 auto 14px; width: 46px; height: 46px; fill: var(--blue); }
  .ch { display: inline-block; white-space: pre; }
</style></head>
<body><div id="stage">
  <div id="glow" class="abs"></div>
  <div id="logo" class="abs"><img src="assets/logo.png"></div>
  <div id="eyebrow" class="abs split">CONTACT US</div>
  <div id="ph1" class="abs ph"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></span><span class="split">+92 370 0035896</span></div>
  <div id="ph2" class="abs ph"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></span><span class="split">+92 312 4222204</span></div>
  <div id="rule" class="abs"></div>
  <div id="addr" class="abs"><svg class="pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span class="split">Iqbal, 8 Allama, Raza Block Town,</span><br><span class="split">Lahore, Pakistan</span></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
// split text into characters (the reference reveals its titles letter by letter with a soft blur)
document.querySelectorAll('.split').forEach(el => {
  const t = el.textContent; el.textContent = '';
  for (const c of t) { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; el.appendChild(s); }
});
const tl = gsap.timeline({ paused: true });
const reveal = (sel, at, stagger = 0.022) => tl.fromTo(sel + ' .ch',
  { opacity: 0, filter: 'blur(10px)', y: 10 },
  { opacity: 1, filter: 'blur(0px)', y: 0, duration: 0.42, ease: 'power2.out', stagger }, at);
tl.fromTo('#logo', { opacity: 0, scale: 0.9, filter: 'blur(14px)' },
       { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.8, ease: 'power3.out' }, 0.3);
reveal('#eyebrow', 0.95, 0.03);
tl.fromTo('#ph1 .ic', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2)' }, 1.15);
reveal('#ph1', 1.2);
tl.fromTo('#ph2 .ic', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2)' }, 1.4);
reveal('#ph2', 1.45);
tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, 1.75);
tl.fromTo('#addr .pin', { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'bounce.out' }, 1.85);
reveal('#addr', 1.95, 0.016);
tl.fromTo('#logo', { y: 0 }, { y: -8, duration: 3.5, ease: 'sine.inOut' }, 1.1);      // gentle float
window.renderAt = t => { tl.seek(t, false); return true; };
window.ready = document.fonts.ready.then(() => true);
</script></body></html>
